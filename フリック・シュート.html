<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07081a">
<meta name="description" content="引っぱって放つ物理フリックで灯籠に光の玉を届けるゲーム。特殊演出100種以上。">
<meta property="og:title" content="フリック・シュート">
<meta property="og:description" content="引っぱって放つ物理フリックで灯籠に光の玉を届けるゲーム。特殊演出100種以上。">

<title>フリック・シュート｜引いて、放って、灯せ。</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307081a'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23ff9f43'/%3E%3C/svg%3E">
<!--
  フリック・シュート — 1ファイル完結のブラウザゲーム
  ・サーバー不要／インストール不要／オフライン動作（このHTMLを開くだけ）
  ・記録は localStorage（この端末内）にのみ保存。外部送信なし
  ・効果音はWebAudioでその場で合成、絵はCanvas/CSSで描画（外部素材なし）
  ・改造するときは、下の <script> 内「ゲーム本体」部分を編集してください
-->
<style>
/* =============================================================
 *  ARCADE CORE — 共通スタイル
 *  色は :root の変数で管理。--acc（アクセント色）は各ゲーム・各章で変わります。
 * ============================================================= */
:root{
  --acc:#ffd54a; --bg:#07081a; --fg:#ffffff; --sub:#c9cbe8;
  --line:rgba(255,255,255,.16); --card:rgba(10,12,34,.86);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit}
#stage{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{position:absolute;inset:0}
#flash{position:fixed;inset:0;pointer-events:none;z-index:29;opacity:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;display:block}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;display:flex;align-items:flex-start;gap:10px;
  padding:calc(10px + var(--safe-t)) 12px 18px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
#hud[hidden]{display:none}
.hud-l{min-width:0}
.hud-score{font-size:clamp(28px,7.5vw,42px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px var(--acc)}
.hud-score.pop{animation:pop .22s ease-out}
.hud-best{font-size:12px;color:var(--sub);margin-top:5px;font-weight:800;letter-spacing:.04em}
.hud-m{flex:1;display:flex;justify-content:center;align-items:center;gap:4px;font-weight:900;font-size:20px;min-height:44px;text-shadow:0 2px 0 #000}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hud-btns{display:flex;gap:6px}
#hudCh{font-size:12px;font-weight:900;color:var(--acc);text-shadow:0 1px 2px #000;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.icon-btn{pointer-events:auto;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.45);
  color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.icon-btn:active{transform:scale(.92)}

/* ---------- コンボ表示 ---------- */
#combo{position:absolute;left:50%;top:calc(74px + var(--safe-t));transform:translateX(-50%);z-index:6;pointer-events:none;
  text-align:center;font-weight:900;opacity:0;transition:opacity .2s;--cc:var(--acc)}
#combo.on{opacity:1}
#combo .n{font-size:clamp(26px,7vw,36px);line-height:1;color:#fff;text-shadow:0 0 12px var(--cc),0 0 26px var(--cc),0 3px 0 #000}
#combo .n small{font-size:.45em;letter-spacing:.1em;margin-left:4px}
#combo .m{display:inline-block;margin-top:3px;font-size:14px;padding:2px 10px;border-radius:999px;background:var(--cc);color:#111}
#combo.bump .n{animation:bump .22s ease-out}

/* ---------- 物語のひとこと ---------- */
#storybar{position:absolute;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);width:min(92vw,560px);z-index:4;
  text-align:center;font-size:13px;line-height:1.5;color:#eef;background:rgba(0,0,0,.5);border:1px solid var(--line);
  border-radius:16px;padding:7px 14px;pointer-events:none;opacity:0;transition:opacity .7s}
#storybar.on{opacity:1}

/* ---------- 画面（タイトル／結果／図鑑／一時停止） ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  background:radial-gradient(ellipse at center,rgba(5,6,22,.45),rgba(3,3,12,.88))}
.screen[hidden]{display:none}
.card{width:min(100%,520px);margin:auto;text-align:center}
.logo{font-size:clamp(40px,12vw,72px);font-weight:900;letter-spacing:-.02em;line-height:1.05;
  background:linear-gradient(180deg,#fff 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px var(--acc));animation:float 3s ease-in-out infinite;padding:4px 0}
.logo.sm{font-size:clamp(30px,9vw,48px)}
.tagline{font-size:clamp(17px,4.6vw,21px);font-weight:900;margin:10px 0 14px}
.rule{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.7;text-align:left}
.rule b{color:var(--acc)}
.prologue{font-size:13px;color:var(--sub);margin:12px 4px;line-height:1.75}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;border:0;
  font-weight:900;font-size:17px;cursor:pointer;color:#111;background:var(--acc);text-decoration:none;
  box-shadow:0 6px 0 rgba(0,0,0,.4),0 0 22px rgba(255,255,255,.12);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn.big{min-height:64px;font-size:24px;width:100%;margin-top:14px}
.btn.pulse{animation:pulse 1.5s ease-in-out infinite}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line);box-shadow:none}
.btn.dark{background:#000;color:#fff;border:1px solid #555}
.btn.sm{min-height:44px;font-size:14px;padding:0 12px}
.btn[aria-pressed="false"]{opacity:.55}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.meta{font-size:14px;color:var(--sub);margin-top:12px}
.meta b{color:#fff}
.keys{font-size:12px;color:var(--sub);margin-top:10px}
.privacy{font-size:11px;color:#a3a5c8;margin-top:12px;line-height:1.6}

/* 結果画面 */
#result{background:radial-gradient(ellipse at center,rgba(6,7,26,.82),rgba(3,3,12,.95))}
.res-head{font-size:14px;letter-spacing:.4em;color:var(--sub);font-weight:900}
.res-ch{font-size:14px;font-weight:800;color:var(--acc);margin-top:4px}
.res-score{font-size:clamp(56px,18vw,120px);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 40%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px var(--acc))}
.res-unit{font-size:16px;color:var(--sub);font-weight:800;margin-top:-6px}
.res-new{display:inline-block;margin-top:6px;background:linear-gradient(90deg,#ff3df2,#ffd54a,#3dfcff);color:#111;font-weight:900;
  padding:5px 14px;border-radius:999px;animation:pulse .9s ease-in-out infinite}
.res-new[hidden]{display:none}
.rank{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 6px}
.rank .g{width:66px;height:66px;flex:none;border-radius:18px;font-size:36px;font-weight:900;display:grid;place-items:center;
  background:var(--acc);color:#111;transform:rotate(-7deg);box-shadow:0 0 30px var(--acc)}
.rank .g.in{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.rank .t{font-size:clamp(20px,5.6vw,26px);font-weight:900;text-align:left;line-height:1.25}
.rank .t small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.res-story{font-size:14px;line-height:1.7;margin:8px 0;color:#f2f2ff;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stat{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:7px 4px}
.stat b{display:block;font-size:clamp(15px,4.4vw,20px);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}
.res-sp-h{font-size:13px;font-weight:800;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:6px 0 4px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.chip.new{background:rgba(255,213,74,.22);border-color:#ffd54a;color:#fff6c8}
.res-best{font-size:12px;color:var(--sub);margin-top:12px}

/* 図鑑 */
.dex h2{font-size:26px;font-weight:900;margin-bottom:8px}
.dex-sum{display:flex;align-items:center;gap:10px;font-weight:900}
.bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#fff);border-radius:99px}
.dex-note{font-size:12px;color:var(--sub);margin:8px 0}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;text-align:left;max-height:58vh;overflow-y:auto;padding:2px;
  -webkit-overflow-scrolling:touch}
.dex-cat{grid-column:1/-1;font-weight:900;color:var(--acc);margin-top:8px;font-size:14px}
.dex-item{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:13px}
.dex-item.on{border-color:var(--acc);background:rgba(255,255,255,.1)}
.dex-item .nm{font-weight:900}
.dex-item .ds{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}
.dex-item .lv{float:right;font-size:10px;color:var(--acc)}

/* ---------- 大見出し演出（バナー） ---------- */
#banner{position:fixed;left:0;right:0;top:33%;z-index:40;text-align:center;pointer-events:none;opacity:0;--bc:#fff}
#banner.show{animation:bannerIn 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
#banner.lv3.show{animation-duration:1.9s}
#banner.lv4.show{animation-duration:2.4s}
#banner .bt{display:inline-block;max-width:100vw;font-size:clamp(28px,8.5vw,52px);font-weight:900;color:#fff;padding:4px 26px;line-height:1.2;
  text-shadow:0 0 12px var(--bc),0 0 28px var(--bc),0 4px 0 rgba(0,0,0,.7);
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.6) 14%,rgba(0,0,0,.6) 86%,transparent)}
#banner.lv4 .bt{font-size:clamp(34px,10.5vw,66px)}
#banner .bs{display:table;font-size:clamp(13px,3.7vw,17px);font-weight:800;margin:6px auto 0;max-width:92vw;color:#fff;line-height:1.5;
  padding:3px 14px;border-radius:999px;background:rgba(0,0,0,.62);text-shadow:0 1px 3px #000,0 0 10px var(--bc)}

/* ---------- 通知 ---------- */
#toasts{position:fixed;bottom:calc(58px + var(--safe-b));left:8px;right:8px;z-index:50;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
body.scr #toasts{bottom:auto;top:calc(8px + var(--safe-t))}
.toast{background:rgba(10,10,30,.86);border:1px solid var(--acc);color:#fff;font-size:13px;padding:7px 11px;border-radius:12px;max-width:100%;
  animation:toastIn .3s ease-out;box-shadow:0 4px 16px rgba(0,0,0,.5);transition:opacity .4s,transform .4s}
.toast b{color:var(--acc);margin-right:4px}
.toast span{color:var(--sub);margin-left:6px;font-size:11px}
.toast.out{opacity:0;transform:translateY(-10px)}

/* ---------- エラー表示 ---------- */
#err{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:100;background:#2a0b14;border:2px solid #ff5a7a;
  border-radius:16px;padding:12px;font-size:14px;line-height:1.6;color:#fff}
#err[hidden]{display:none}

/* ---------- 画面全体のエフェクト ---------- */
.fx-zoom{animation:fxZoom .5s ease-out}
.fx-glitch{animation:fxGlitch .6s steps(2)}
.fx-hue{animation:fxHue 1.2s linear}
.fx-tilt{animation:fxTilt .8s ease-out}
.fx-bright{animation:fxBright .7s ease-out}
.fx-mono{animation:fxMono 1.3s ease-in-out}
body.reduce .fx-glitch,body.reduce .fx-hue,body.reduce .fx-tilt{animation:none}

@keyframes fxZoom{0%{scale:1}25%{scale:1.05}100%{scale:1}}
@keyframes fxGlitch{0%{filter:none;translate:0}20%{filter:hue-rotate(90deg) saturate(2);translate:-6px 0}40%{filter:hue-rotate(-70deg);translate:5px 2px}
  60%{filter:hue-rotate(180deg);translate:-3px -2px}80%{filter:none;translate:2px 0}100%{filter:none;translate:0}}
@keyframes fxHue{to{filter:hue-rotate(360deg)}}
@keyframes fxTilt{30%{rotate:-2deg}60%{rotate:1.5deg}100%{rotate:0deg}}
@keyframes fxBright{30%{filter:brightness(1.5) saturate(1.4)}}
@keyframes fxMono{25%,75%{filter:grayscale(1) contrast(1.25)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.8)}12%{opacity:1;transform:scale(.95)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.04) translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.logo,.btn.pulse,.res-new{animation:none}}
@media (max-height:640px){.prologue{display:none}.btn.big{min-height:56px}}

/* ===== ゲーム固有のスタイル ===== */
/* ⑩ フリック・シュート */
#fsCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#fsCv:active{cursor:grabbing}
#fsHint{position:absolute;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);z-index:3;pointer-events:none;
  font-size:clamp(17px,5vw,22px);font-weight:900;text-align:center;color:#fff;text-shadow:0 2px 0 #000,0 0 14px var(--acc);
  opacity:0;transition:opacity .4s;white-space:nowrap}
#fsHint.on{opacity:1;animation:fsBob 1.2s ease-in-out infinite}
.fs-balls{font-variant-numeric:tabular-nums;font-size:20px;display:flex;align-items:center;gap:6px}
.fs-balls i{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--acc));box-shadow:0 0 8px var(--acc)}
.fs-balls.add{animation:pop .3s}
@keyframes fsBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}

body:not(.scr) #toasts{bottom:auto;top:calc(118px + var(--safe-t))}
/* 上の通知と大見出しが重ならないよう、見出しを通知の下に置く */
body:not(.scr) #banner{top:max(33%, calc(240px + var(--safe-t)))}

</style>
</head>
<body>
<noscript><p style="padding:20px;color:#fff">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>
<div id="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="game"></div>
  <div id="hud" hidden></div>
  <div id="combo" aria-hidden="true"></div>
  <div id="storybar" aria-live="polite"></div>
</div>
<div id="flash" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="banner" aria-hidden="true"></div>
<div id="toasts" aria-live="polite"></div>
<section id="title" class="screen" aria-label="タイトル"></section>
<section id="result" class="screen" aria-label="結果" hidden></section>
<section id="dex" class="screen" aria-label="演出図鑑" hidden></section>
<section id="pauseScr" class="screen" aria-label="一時停止" hidden></section>
<div id="err" role="alert" hidden></div>
<script>
/* ======================= 共通エンジン ======================= */
'use strict';
/* =================================================================
 *  ARCADE CORE v1.0 — ミニゲーム共通エンジン
 *  -----------------------------------------------------------------
 *  このコードは各ゲームのHTMLに「そのまま埋め込まれて」います。
 *  外部ライブラリ・外部通信は一切ありません。
 *  （「Xにポスト」ボタンを押した時だけ、ユーザー操作で投稿画面を開きます）
 *
 *  主な部品:
 *    U        … 小物ユーティリティ
 *    Store    … 端末内保存（localStorage／使えない時はメモリ保存）
 *    Sound    … WebAudioで効果音をその場で合成（音源ファイル不要＝著作権フリー）
 *    Haptic   … 対応端末で軽い振動
 *    FX / PR  … パーティクル・画面揺れ・フラッシュ・演出の部品
 *    Banner / Toast … 大見出しと小さな通知
 *    BG / DECO … 章ごとに変わる背景（ストーリー演出）
 *    Specials … 特殊演出の登録・判定・図鑑（発見状況を端末に保存）
 *    Core     … 画面遷移・スコア・章・結果・Xシェア・エラー処理
 * ================================================================= */

/* ---------- U: ユーティリティ ---------- */
const U = {
  rand(a = 1, b) { return b === undefined ? Math.random() * a : a + Math.random() * (b - a); },
  randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  lerp(a, b, t) { return a + (b - a) * t; },
  $(s, r = document) { return r.querySelector(s); },
  el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; },
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  str(n) { return String(Math.floor(Math.abs(n))); },
  /** ゾロ目（111, 2222 …） */
  isRep(n, min = 3) { const s = U.str(n); return s.length >= min && /^(\d)\1+$/.test(s); },
  /** 回文（121, 3443 …） */
  isPal(n, min = 3) { const s = U.str(n); return s.length >= min && s === s.split('').reverse().join(''); },
  /** 連番（step=1 で 123、step=-1 で 321） */
  isRun(n, step, min = 3) { const s = U.str(n); if (s.length < min) return false; for (let i = 1; i < s.length; i++) if (+s[i] - +s[i - 1] !== step) return false; return true; },
  digitSum(n) { return U.str(n).split('').reduce((a, c) => a + +c, 0); },
  fmt(n) { return Math.round(n).toLocaleString('ja-JP'); },
  now() { return performance.now(); }
};
const wrap = (v, m) => ((v % m) + m) % m;
/** シード付き乱数（背景の配置を毎回同じにする） */
function seeded(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/** ペンタトニック音階（どの順で鳴らしても気持ちよく響く） */
const PENTA = [0, 2, 4, 7, 9];
const penta = (i, base = 72) => base + 12 * Math.floor(i / 5) + PENTA[((i % 5) + 5) % 5];

/* ---------- 色パレット（演出で使う） ---------- */

/* ---------- Store: 端末内保存 ---------- */
const Store = (() => {
  let ns = 'arcade', ok = true; const mem = {};
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
  return {
    setNs(n) { ns = n; },
    get(k, d) { const key = ns + ':' + k; try { const v = ok ? localStorage.getItem(key) : (key in mem ? mem[key] : null); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const key = ns + ':' + k, s = JSON.stringify(v); try { if (ok) localStorage.setItem(key, s); else mem[key] = s; } catch (e) { mem[key] = s; } },
    del(k) { const key = ns + ':' + k; try { if (ok) localStorage.removeItem(key); } catch (e) { } delete mem[key]; },
    ok: () => ok
  };
})();

/* ---------- Sound: 効果音の合成 ---------- */
const Sound = {
  ctx: null, out: null, on: true, buf: null,
  /** 最初のタップ/キー操作で呼ぶ（ブラウザの自動再生制限のため） */
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => { }); return; }

      this.out = c.createGain(); this.out.gain.value = 0.55; this.out.connect(comp); comp.connect(c.destination);
      const len = c.sampleRate; const b = c.createBuffer(1, len, c.sampleRate); const d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  },
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  ready() { return this.on && this.ctx && this.ctx.state === 'running'; },
  /** 単音 f:周波数 d:長さ(秒) o:{type,vol,slide,delay,attack} */
  tone(f, d = 0.12, o = {}) {
    if (!this.ready()) return;

      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + d);
      const v = Math.max(0.0002, o.vol == null ? 0.22 : o.vol), a = o.attack || 0.004;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      osc.connect(g); g.connect(this.out); osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { }
  },
  /** ノイズ（シュッ・ドン・パチ などの質感） */
  noise(d = 0.1, o = {}) {
    if (!this.ready() || !this.buf) return;
    try {
      const c = this.ctx, t = c.currentTime + (o.delay || 0) + 0.003;
      const s = c.createBufferSource(); s.buffer = this.buf;
      const f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1000, t);

      const g = c.createGain(); g.gain.setValueAtTime(o.vol == null ? 0.2 : o.vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

    } catch (e) { }
  },
  /** MIDIノート番号の列を順に鳴らす（0/null は休符） */
  seq(notes, step = 0.08, o = {}) { notes.forEach((m, i) => { if (!m) return; this.tone(this.hz(m), o.dur || step * 1.8, Object.assign({}, o, { delay: (o.delay || 0) + i * step })); }); },

};
/* 演出用のメロディ素材（すべてこの場で合成・オリジナル） */
const MOTIF = {

  fanfare: b => Sound.seq([b, b + 4, b + 7, b + 12, 0, b + 7, b + 16], 0.085, { type: 'square', vol: 0.08 }),
  sparkle: b => Sound.seq([b + 12, b + 19, b + 24, b + 28, b + 31, b + 36], 0.035, { type: 'triangle', vol: 0.13 }),
  power: b => { Sound.tone(Sound.hz(b - 12), 0.45, { type: 'sawtooth', slide: Sound.hz(b + 12), vol: 0.09 }); Sound.noise(0.4, { freq: 3000, vol: 0.07, q: 0.6 }); },
  boom: () => { Sound.noise(0.6, { freq: 180, vol: 0.45, ft: 'lowpass' }); Sound.tone(90, 0.5, { slide: 35, vol: 0.4 }); },
  laser: b => Sound.tone(Sound.hz(b + 24), 0.22, { type: 'square', slide: Sound.hz(b), vol: 0.07 }),
  bell: b => [0, 12, 19, 24].forEach((d, i) => Sound.tone(Sound.hz(b + d), 1.2 - i * 0.2, { vol: 0.17 / (i + 1) })),
  magic: b => Sound.seq([b, b + 2, b + 4, b + 6, b + 8, b + 10, b + 12, b + 14], 0.045, { type: 'triangle', vol: 0.13 }),
  glitch: () => { for (let i = 0; i < 8; i++) Sound.tone(U.rand(200, 2000), 0.04, { type: 'square', vol: 0.05, delay: i * 0.035 }); },
  drum: () => [0, 0.12, 0.24, 0.3, 0.36].forEach(d => Sound.noise(0.08, { freq: 700, vol: 0.32, delay: d })),
  wow: b => { Sound.tone(Sound.hz(b), 0.25, { type: 'triangle', slide: Sound.hz(b + 12), vol: 0.17 }); Sound.tone(Sound.hz(b + 12), 0.3, { type: 'triangle', slide: Sound.hz(b + 5), vol: 0.14, delay: 0.22 }); },
  up: b => Sound.seq([b, b + 4, b + 7, b + 11, b + 14], 0.06, { type: 'triangle', vol: 0.17 }),
  down: b => Sound.seq([b + 7, b + 3, b, b - 5], 0.09, { type: 'triangle', vol: 0.15 }),
  chord: b => [0, 4, 7, 12].forEach(d => Sound.tone(Sound.hz(b + d), 1.0, { type: 'triangle', vol: 0.09, attack: 0.03 })),
  zap: b => { Sound.noise(0.15, { freq: 5000, vol: 0.14 }); Sound.tone(Sound.hz(b + 12), 0.15, { type: 'sawtooth', slide: Sound.hz(b - 12), vol: 0.07 }); },
  heart: b => Sound.seq([b + 7, b + 12], 0.14, { vol: 0.2, dur: 0.3 }),
  meow: b => { Sound.tone(Sound.hz(b + 7), 0.35, { type: 'triangle', slide: Sound.hz(b + 2), vol: 0.15 }); },
  ufo: b => { for (let i = 0; i < 10; i++) Sound.tone(Sound.hz(b + (i % 2 ? 5 : 0)), 0.08, { vol: 0.11, delay: i * 0.06 }); },
  jingle: b => { const sc = [0, 2, 4, 7, 9, 12, 14, 16]; const n = []; for (let i = 0; i < 8; i++) n.push(b + U.pick(sc)); n.push(b + 12); Sound.seq(n, 0.07, { type: 'square', vol: 0.06 }); },
  whoosh: () => Sound.noise(0.35, { freq: 900, vol: 0.2, sweep: 4200 }),
  royal: b => { Sound.seq([b, b, b + 7, b + 12, b + 16, b + 19], 0.11, { type: 'sawtooth', vol: 0.06 }); setTimeout(() => MOTIF.chord(b + 12), 700); },
  star: b => Sound.seq([b + 24, b + 19, b + 28], 0.06, { vol: 0.15 }),
  tada: b => { Sound.seq([b + 7, b + 12], 0.06, { type: 'square', vol: 0.07 }); setTimeout(() => MOTIF.chord(b + 12), 150); },
  wind: () => Sound.noise(0.9, { freq: 500, vol: 0.18, sweep: 1500, q: 0.5 }),

/* ---------- FX: パーティクル & 画面エフェクト ---------- */
const FX = {
  cv: null, cx: null, w: 0, h: 0, dpr: 1, P: [], reduce: false,
  shakeT: 0, shakeI: 0, stage: null, flashEl: null, lastFlash: 0,
  init() { this.cv = U.$('#fx'); this.cx = this.cv.getContext('2d'); this.stage = U.$('#stage'); this.flashEl = U.$('#flash'); this.resize(); },
  resize() { this.dpr = Math.min(2, window.devicePixelRatio || 1); this.w = innerWidth; this.h = innerHeight; this.cv.width = Math.round(this.w * this.dpr); this.cv.height = Math.round(this.h * this.dpr); this.cx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); },
  /** パーティクルを1つ追加 */
  spawn(o) {
    const p = { x: 0, y: 0, vx: 0, vy: 0, life: 1, size: 4, color: '#fff', shape: 'dot', rot: 0, vr: 0, grav: 0, drag: 1, add: true, grow: 0, delay: 0, alpha: 1 };
    Object.assign(p, o); p.max = p.life;
    if (this.P.length > 1600) this.P.splice(0, 300);
    this.P.push(p); return p;
  },
  /** 浮かび上がる文字 */
  /** 大見出し・通知の帯にかかる y を、近いほうの外側（上か下）へ逃がす */
  rects() { return [Banner.rect(), Toast.rect()].filter(Boolean); },
  avoid(y, size, rs = this.rects()) {
    const m = size * 0.62, H = innerHeight, bad = v => v < 60 || v > H - 70 || rs.some(r => v > r.top - m && v < r.bottom + m);
    if (!bad(y)) return y;
    const c = []; rs.forEach(r => c.push(r.top - m, r.bottom + m));
    c.sort((a, b) => Math.abs(a - y) - Math.abs(b - y));
    return c.find(v => !bad(v)) ?? y;
  },
  /** 大見出しや通知が出た瞬間、そこに重なっている浮き文字をよける */
  clearRects() { const rs = this.rects(); if (!rs.length) return; for (const p of this.P) if (p.shape === 'text' && p.life > p.max * 0.2) { const ny = this.avoid(p.y, p.size, rs); if (ny !== p.y) p.y = ny; } },
  text(x, y, str, color = '#fff', size = 28, o = {}) {
    // 画面に出ている文字と重なるなら、その上へずらす（実際の位置で判定）
    const ch = String(str), W = t => [...t].reduce((w, c) => w + (c.charCodeAt(0) > 255 ? 1 : 0.62), 0);
    const w = W(ch) * size, live = this.P.filter(p => p.shape === 'text' && p.life > p.max * 0.2);
    for (let k = 0; k < 8; k++) {
      const hit = live.find(p => Math.abs(p.x - x) < (w + W(p.ch) * p.size) / 2 && Math.abs(p.y - y) < (p.size + size) * 0.58);
      if (!hit) break; y = hit.y - (hit.size + size) * 0.62;

  },

  shake(i = 6, d = 0.3) { if (this.reduce) i *= 0.3; this.shakeI = Math.max(this.shakeT > 0 ? this.shakeI : 0, i); this.shakeT = Math.max(this.shakeT, d); },
  /** 画面フラッシュ（光過敏への配慮：最大不透明度・連続発光を制限） */
  flash(color = '#fff', a = 0.5) {
    const n = U.now(); let al = Math.min(0.55, a); if (n - this.lastFlash < 350) al *= 0.4; if (this.reduce) al *= 0.25; this.lastFlash = n;

    e.style.transition = 'opacity .45s ease-out'; e.style.opacity = 0;
  },
  /** 画面全体にCSSエフェクト（fx-zoom / fx-glitch / fx-hue / fx-tilt / fx-bright / fx-mono） */
  css(name, ms = 1000) {
    if (this.reduce && /glitch|hue|tilt/.test(name)) return;
    const s = this.stage; s.classList.remove(name); void s.offsetWidth; s.classList.add(name);

  },
  update(dt) {
    const P = this.P;

      const p = P[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.life -= dt;
      if (p.life <= 0) { P[i] = P[P.length - 1]; P.pop(); continue; }
      if (p.drag !== 1) { const d = Math.pow(p.drag, dt * 60); p.vx *= d; p.vy *= d; }
      p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;

      this.shakeT -= dt;
      if (this.shakeT > 0) { const k = this.shakeI * U.clamp(this.shakeT / 0.15, 0, 1); this.stage.style.transform = `translate(${U.rand(-k, k).toFixed(1)}px,${U.rand(-k, k).toFixed(1)}px)`; }

        case 'heart': drawHeart(c, p.x, p.y, p.size, p.rot); break;
        case 'petal': c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.beginPath(); c.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, 6.2832); c.fill(); c.restore(); break;
        case 'vband': c.fillRect(p.x - p.size / 2, 0, p.size, this.h); break;
        case 'hband': c.fillRect(0, p.y - p.size / 2, this.w, p.size); break;

          [[p.size * t, p.color], [p.size * 0.35, '#fff']].forEach(([lw, col]) => { c.strokeStyle = col; c.lineWidth = Math.max(0.5, lw); c.beginPath(); p.pts.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.stroke(); });
          break;
        }

          c.save(); c.translate(p.x, p.y); if (p.rot) c.rotate(p.rot); c.scale(pop * (p.flip ? -1 : 1), pop);
          c.font = `900 ${p.size}px system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
          c.textAlign = 'center'; c.textBaseline = 'middle';
          if (p.shape === 'text') { c.lineWidth = Math.max(3, p.size / 6); c.strokeStyle = 'rgba(0,0,0,.78)'; c.lineJoin = 'round'; c.strokeText(p.ch, 0, 0); c.fillStyle = p.color; }

function drawStar(c, x, y, r, rot) { c.beginPath(); for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); c.fill(); }

  confetti(x, y, pal, lv = 2) { const n = 40 + lv * 35; for (let i = 0; i < n; i++) FX.spawn({ x: U.rand(FX.w), y: U.rand(-140, -10), vx: U.rand(-50, 50), vy: U.rand(90, 260), life: U.rand(2.2, 3.6), size: U.rand(7, 12), color: U.pick(pal), shape: 'rect', rot: U.rand(6), vr: U.rand(-7, 7), grav: 40, drag: 0.995, add: false, fn: swayFn, ph: U.rand(6) }); },

/* ---------- Banner / Toast ---------- */
const Banner = {
  el: null, until: 0, lv: 0, tm: 0, pt: 0, q: [], vis: 0,
  /** 大見出し。表示中なら順番待ちにして、文字が重ならないよう1つずつ出す（格の高い演出は割り込み） */
  show(title, sub, color = '#fff', lv = 2) {
    if (!this.el) return false;
    const n = U.now();
    if (n < this.until && lv <= this.lv) {
      this.q = this.q.filter(b => n - b.at < 2500);
      this.q.push({ title, sub, color, lv, at: n }); this.q.sort((a, b) => b.lv - a.lv);
      if (this.q.length > 2) this.q.length = 2;
      this.pump(); return true;
    }
    this._show(title, sub, color, lv); return true;
  },
  _show(title, sub, color, lv) {
    const n = U.now(), e = this.el; e.style.setProperty('--bc', color);
    e.innerHTML = `<div class="bt">${U.esc(title)}</div>${sub ? `<div class="bs">${U.esc(sub)}</div>` : ''}`;
    e.className = ''; void e.offsetWidth; e.className = 'show lv' + lv;
    const dur = lv >= 4 ? 2400 : lv === 3 ? 1900 : 1500; this.until = n + dur * 0.7; this.lv = lv;
    clearTimeout(this.tm); this.tm = setTimeout(() => { e.className = ''; }, dur); this.vis = n + dur * 0.9;
    FX.clearRects();
    if (this.q.length) this.pump();
  },
  /** 表示中の大見出しの縦の範囲（文字のある部分だけ） */
  rect() {
    if (!this.el || !(U.now() < this.vis)) return null;
    let top = 1e9, bottom = -1e9;
    const y0 = this.el.offsetTop; // 拡大アニメの影響を受けない、本来の位置で測る
    for (const c of this.el.children) if (c.offsetHeight) { top = Math.min(top, y0 + c.offsetTop); bottom = Math.max(bottom, y0 + c.offsetTop + c.offsetHeight); }
    return top < bottom ? { top: top - 4, bottom: bottom + 4 } : null;
  },
  pump() {
    clearTimeout(this.pt);
    this.pt = setTimeout(() => { const b = this.q.shift(); if (b && Core.state === 'play') this._show(b.title, b.sub, b.color, b.lv); }, Math.max(0, this.until - U.now()));
  },
  clear() { this.q = []; clearTimeout(this.pt); this.vis = 0; }
};

/* ---------- Specials: 特殊演出の登録・判定・図鑑 ---------- */
/*  1件の特殊演出の書式:
 *  { id:'一意なID', ev:'発火イベント名', cat:'図鑑の分類', name:'名前', desc:'発見後の説明', hint:'未発見時のヒント',
 *    lv:1〜4（大きいほど派手）, rep:true（1プレイ中に何度でも発火）, test:(ctx)=>bool,
 *    fx:{ c:'パレット名', p:['部品名',...], snd:'メロディ名', n:基準音, b:'見出し', s:'小見出し',
 *         sh:揺れ, fl:フラッシュ, css:'fx-…', slow:スロー秒, hs:ヒットストップ秒, emoji:'🐈', ch:'文字' },
 *    run:(x,y,ctx)=>{} 追加の独自処理 }                                                        */
const Specials = {
  list: [], map: {}, dex: {}, run: new Set(), runList: [], runNew: new Set(),
  load() { this.dex = Store.get('dex', {}) || {}; },
  define(arr) { for (const s of arr) { if (!s || this.map[s.id]) { if (s) console.warn('duplicate special', s.id); continue; } s.lv = s.lv || 1; this.list.push(s); this.map[s.id] = s; } },
  total() { return this.list.length; },
  foundCount() { let n = 0; for (const s of this.list) if (this.dex[s.id]) n++; return n; },
  reset() { this.run = new Set(); this.runList = []; this.runNew = new Set(); },
  /** イベント発生時に呼ぶ。条件に合う演出を格の高い順に max 件まで再生 */
  check(ev, ctx = {}, x, y, max = 2) {
    const hits = [];
    for (const s of this.list) {
      if (s.ev !== ev) continue;
      if (!s.rep && this.run.has(s.id)) continue;
      let ok = false; try { ok = !!s.test(ctx); } catch (e) { ok = false; }
      if (ok) hits.push(s);
    }
    if (!hits.length) return hits;
    hits.sort((a, b) => b.lv - a.lv);
    const play = hits.slice(0, max);
    play.forEach((s, i) => { const go = () => this.fire(s, x, y, ctx); i === 0 ? go() : setTimeout(go, i * 480); });
    return play;
  },
  fire(s, x, y, ctx) {
    this.run.add(s.id); if (!this.runList.includes(s.id)) this.runList.push(s.id);
    const isNew = !this.dex[s.id];
    if (isNew) { this.dex[s.id] = Date.now(); Store.set('dex', this.dex); this.runNew.add(s.id); }
    try { playSpecial(s, x, y, ctx); } catch (e) { console.error(e); }
    if (isNew) Toast.show(`<b>NEW!</b>演出発見『${U.esc(s.name)}』<span>${this.foundCount()}/${this.total()}</span>`);
  }
};
/** 特殊演出の再生（fx の指定を部品の組み合わせに変換） */
function playSpecial(s, x, y, ctx) {
  const f = s.fx || {}, lv = s.lv, pal = PAL[f.c] || PAL.gold;
  if (x == null) { x = FX.w / 2; y = FX.h * 0.42; }
  const parts = f.p || (lv >= 3 ? ['burst', 'ring', 'confetti'] : lv === 2 ? ['burst', 'ring'] : ['burst']);
  parts.forEach(n => { const fn = PR[n]; if (fn) fn(x, y, pal, lv, f); });
  if (f.emoji) PR.walker(x, y, pal, lv, f);
  if (f.sh || lv >= 3) FX.shake(f.sh || lv * 2.5, 0.25 + lv * 0.08);
  if (f.fl) FX.flash(f.flc || pal[0], f.fl);
  if (f.css) FX.css(f.css);
  if (f.slow) Core.slow(f.slow);
  if (f.hs) Core.hitStop(f.hs);
  Sound.motif(f.snd || (lv >= 3 ? 'fanfare' : lv === 2 ? 'up' : 'chime'), f.n || 72);
  const title = typeof f.b === 'function' ? f.b(ctx) : (f.b || s.name);
  const sub = typeof f.s === 'function' ? f.s(ctx) : (f.s != null ? f.s : (s.desc || ''));
  const col = f.col || pal[0];
  const shown = lv >= 2 && Banner.show(title, sub, col, lv);
  if (!shown) FX.text(x, y - 46, title, col, lv >= 2 ? 30 : 24);
  Haptic.vib(lv >= 3 ? [30, 40, 60] : 10 + lv * 8);
  if (s.run) try { s.run(x, y, ctx); } catch (e) { }
}

/* ---------- 全ゲーム共通の特殊演出（スコア・時刻・日付・プレイ回数・レア・記録・物語） ---------- */
function commonSpecials(cfg) {
  const S = [];
  const sc = (id, name, desc, hint, test, lv, fx, rep) => S.push({ id: 'c_' + id, ev: 'score', cat: 'スコアの数字', name, desc, hint, test, lv, fx, rep });
  const live = c => !c.silent && c.score > 0;
  sc('end0', 'キリ番', 'スコアの一の位が0になった', '一の位に注目', c => live(c) && c.score % 10 === 0, 1, { c: 'mint', p: ['ring'], snd: 'chime', n: 84 }, true);
  sc('end00', 'ダブルキリ番', '下2桁が00になった', '一の位と十の位が…', c => live(c) && c.score % 100 === 0, 2, { c: 'ice', p: ['ring', 'burst', 'sparkle'], snd: 'sparkle', b: 'ダブルキリ番！', s: c => `${U.fmt(c.score)}点ピッタリ` }, true);

  sc('desc', 'カウントダウン', '4321のように数字が1ずつ下がる', '数字の階段（下り）', c => live(c) && U.isRun(c.score, -1), 3, { c: 'fire', p: ['implode'], snd: 'down', b: c => `${c.score}…発射！` }, true);
  sc('777', 'ラッキー777', 'スコアに777がふくまれた', '幸運の数字が3つ', c => live(c) && U.str(c.score).includes('777'), 3, { c: 'rainbow', p: ['wave', 'stars', 'confetti'], snd: 'jingle', fl: 0.2 }, true);

  (cfg.milestones || [1000, 5000, 10000, 20000, 50000]).forEach((m, i) => S.push({ id: 'c_ms' + m, ev: 'score', cat: 'スコアの数字', name: `${U.fmt(m)}点突破`, desc: `1プレイで${U.fmt(m)}点に到達`, hint: `${U.fmt(m)}点をめざそう`, lv: Math.min(4, 2 + Math.floor(i / 2)), test: c => c.prev < m && c.score >= m, fx: { c: ['mint', 'ice', 'gold', 'royal', 'rainbow'][i % 5], p: i >= 3 ? ['shock', 'fireworks'] : ['ring', 'stars'], snd: i >= 3 ? 'royal' : 'tada' } }));
  S.push({ id: 'c_half', ev: 'score', cat: '記録', name: 'ハイスコアの折り返し', desc: '自己ベストの半分に到達', hint: '自己ベストの半分', lv: 1, test: c => c.best > 0 && c.prev < c.best / 2 && c.score >= c.best / 2, fx: { c: 'mint', p: ['ring'], snd: 'chime', b: 'ベストの半分！' } });
  S.push({ id: 'c_beat', ev: 'score', cat: '記録', name: '記録更新の瞬間', desc: 'プレイ中に自己ベストを超えた', hint: 'プレイ中に自己ベストを…', lv: 4, test: c => c.best > 0 && c.prev <= c.best && c.score > c.best, fx: { c: 'royal', p: ['shock', 'stars', 'confetti'], snd: 'royal', fl: 0.35, hs: 0.12, b: 'NEW RECORD!!', s: '自己ベストを更新中！' } });
  S.push({ id: 'c_double', ev: 'score', cat: '記録', name: 'ベストの2倍', desc: 'プレイ中に自己ベストの2倍に到達', hint: 'ベストを大きく超えると…', lv: 4, test: c => c.best >= 100 && c.prev < c.best * 2 && c.score >= c.best * 2, fx: { c: 'rainbow', p: ['implode', 'fireworks', 'wave'], snd: 'royal', css: 'fx-hue', b: '自己ベスト×2!!' } });

  const st = (id, cat, name, desc, hint, test, lv, fx) => S.push({ id: 'c_' + id, ev: 'start', cat, name, desc, hint, test, lv, fx });
  const H = c => c.now.getHours(), M = c => c.now.getMonth() + 1, D = c => c.now.getDate();

  st('weekend', '時刻と日付', '週末ゲーマー', '土日に遊んだ', '週末に遊ぶと…', c => c.now.getDay() === 0 || c.now.getDay() === 6, 1, { c: 'candy', p: ['burst'], snd: 'chime' });
  const day = (id, name, desc, hint, test, fx) => st(id, '時刻と日付', name, desc, hint, test, 3, fx);
  day('newyear', 'お正月', '1月1〜3日に遊んだ', '新しい年の始まり', c => M(c) === 1 && D(c) <= 3, { c: 'crimson', p: ['fireworks', 'confetti'], snd: 'royal', s: 'あけましておめでとう！' });
  day('valentine', 'バレンタイン', '2月14日に遊んだ', '2月のあの日', c => M(c) === 2 && D(c) === 14, { c: 'sakura', p: ['hearts'], snd: 'heart', s: 'ハートがいっぱい' });
  day('catday', '猫の日', '2月22日（ニャンニャンニャン）に遊んだ', '2が3つ並ぶ日', c => M(c) === 2 && D(c) === 22, { c: 'candy', p: ['hearts'], snd: 'meow', emoji: '🐈', s: 'ニャンニャンニャン' });
  day('hina', 'ひなまつり', '3月3日に遊んだ', '春の節句', c => M(c) === 3 && D(c) === 3, { c: 'sakura', p: ['petals'], snd: 'bell' });
  day('april', 'エイプリルフール', '4月1日に遊んだ', 'うそをついてもいい日', c => M(c) === 4 && D(c) === 1, { c: 'neon', p: ['glyphs'], ch: '？！', snd: 'glitch', css: 'fx-tilt', s: '…というのはウソ！' });
  day('tanabata', '七夕', '7月7日に遊んだ', '星に願いを', c => M(c) === 7 && D(c) === 7, { c: 'galaxy', p: ['comet', 'sparkle'], snd: 'star', s: '願いごとはなに？' });
  day('halloween', 'ハロウィン', '10月31日に遊んだ', '仮装の夜', c => M(c) === 10 && D(c) === 31, { c: 'fire', p: ['glyphs', 'burst'], ch: '🎃👻🦇', snd: 'wow', css: 'fx-mono', s: 'トリック・オア・トリート！' });
  day('xmas', 'クリスマス', '12月24〜25日に遊んだ', '聖なる夜', c => M(c) === 12 && (D(c) === 24 || D(c) === 25), { c: 'forest', p: ['snow', 'stars'], snd: 'bell', s: 'メリークリスマス！' });
  day('omisoka', '大晦日', '12月31日に遊んだ', '一年の終わり', c => M(c) === 12 && D(c) === 31, { c: 'gold', p: ['fireworks'], snd: 'bell', n: 55, s: '今年もおつかれさま' });
  day('zorodate', 'ゾロ目の日', '5月5日や11月11日など月と日がそろう日', '月と日が同じ数字', c => M(c) === D(c) || (M(c) === 11 && D(c) === 11), { c: 'mint', p: ['orbit'], snd: 'spin', b: c => `${M(c)}/${D(c)} ゾロ目の日` });
  const pl = (n, name, lv, fx) => st('play' + n, 'プレイ回数', name, `${n}回目のプレイ`, `${n}回遊ぶと…`, c => c.plays === n, lv, fx);
  pl(1, 'はじめまして', 2, { c: 'gold', p: ['ring', 'sparkle'], snd: 'tada', s: 'ようこそ！まずは気楽にどうぞ' });
  pl(10, '10回目の挑戦', 2, { c: 'ice', p: ['stars'], snd: 'up', s: 'すっかり常連さん' });
  pl(30, '30回目の挑戦', 3, { c: 'royal', p: ['stars', 'confetti'], snd: 'fanfare', s: '腕前が上がってきた？' });
  pl(100, '100回目の挑戦', 4, { c: 'rainbow', p: ['fireworks', 'confetti', 'wave'], snd: 'royal', s: '遊んでくれてありがとう！' });

  const lk = (id, name, desc, lo, hi, lv, fx) => S.push({ id: 'c_' + id, ev: 'luck', cat: 'レア', name, desc, hint: '完全な運だめし', lv, test: c => c.r >= lo && c.r < hi, fx });
  lk('rainbow', '伝説の虹', 'ごくまれに現れる虹（約0.4%）', 0, 0.004, 4, { c: 'rainbow', p: ['wave', 'hband', 'sparkle'], snd: 'royal', css: 'fx-hue', s: '超レア！見られたらラッキー' });
  lk('ufo', 'UFO通過', 'まれにUFOが横切る（約0.8%）', 0.004, 0.012, 3, { c: 'toxic', p: ['sparkle'], snd: 'ufo', emoji: '🛸', wy: 0.3, s: 'いまの見た？' });
  lk('cat', '迷い猫', 'まれに猫が通りすぎる（約1.2%）', 0.012, 0.024, 3, { c: 'candy', p: ['hearts'], snd: 'meow', emoji: '🐈', s: 'にゃーん' });
  lk('shoot', '流れ星', 'ときどき流れ星（約2.6%）', 0.024, 0.05, 2, { c: 'ice', p: ['comet'], snd: 'star', s: '願いごとを3回！' });

  const en = (id, name, desc, hint, test, lv, fx) => S.push({ id: 'c_' + id, ev: 'end', cat: '記録', name, desc, hint, test, lv, fx });
  en('newbest', '自己ベスト更新', 'ハイスコアを更新した', '記録を超えよう', c => c.isNew && c.prevBest > 0, 3, { c: 'royal', p: ['fireworks', 'confetti'], snd: 'royal', b: 'NEW RECORD!' });
  en('first', '最初の記録', 'はじめてスコアを記録した', 'まずは1回遊ぶ', c => c.prevBest === 0 && c.score > 0, 2, { c: 'gold', p: ['stars'], snd: 'tada' });
  en('close', 'あと少し！', '自己ベストまであと5%以内', '記録にせまる', c => !c.isNew && c.prevBest > 0 && c.score >= c.prevBest * 0.95 && c.score < c.prevBest, 2, { c: 'sunset', p: ['ring'], snd: 'wow', s: '次こそ更新！' });
  en('same', '同点フィニッシュ', '自己ベストとまったく同じスコア', '記録とピッタリ同じ', c => c.prevBest > 0 && c.score === c.prevBest, 4, { c: 'neon', p: ['cross', 'shock'], snd: 'zap', s: '奇跡の一致' });
  en('fin00', 'ピッタリフィニッシュ', '最終スコアの下2桁が00', '終わりのスコアが…', c => c.score > 0 && c.score % 100 === 0, 3, { c: 'ice', p: ['ring', 'sparkle'], snd: 'bell' });
  en('finrep', 'ゾロ目フィニッシュ', '最終スコアがゾロ目', '終わりのスコアが…', c => U.isRep(c.score), 4, { c: 'gold', p: ['stars', 'confetti'], snd: 'jingle' });
  en('finpal', '回文フィニッシュ', '最終スコアが回文', '終わりのスコアが…', c => c.score >= 100 && U.isPal(c.score) && !U.isRep(c.score), 3, { c: 'neon', p: ['cross'], snd: 'wow' });
  en('zero', 'ドンマイ', 'スコア0で終了', '…0点？', c => c.score === 0, 1, { c: 'mono', p: ['glyphs'], ch: '…', snd: 'drop', s: '次はきっといける！' });
  en('leap', '大躍進', '自己ベストの2倍以上で更新', 'ベストを大きく超える', c => c.isNew && c.prevBest >= 100 && c.score >= c.prevBest * 2, 4, { c: 'rainbow', p: ['fireworks', 'wave'], snd: 'royal', css: 'fx-bright' });

  // 物語：章の到達（第2章以降）とエンディング
  const chs = cfg.chapters || [];
  chs.forEach((ch, i) => {
    if (i === 0) return;
    const last = i === chs.length - 1;
    S.push({ id: 'c_ch' + i, ev: 'chapter', cat: 'ストーリー', name: `${last ? '最終章' : `第${i + 1}章`}「${ch.name}」`, desc: ch.line, hint: `第${i + 1}章へ進むと…`, lv: last ? 4 : 3, test: c => c.chapter === i, fx: { c: ch.pal || 'gold', p: ch.fxp || (last ? ['wave', 'fireworks', 'sparkle'] : ['wave', 'sparkle']), snd: last ? 'royal' : 'chord', n: 60 + i * 2, b: `${last ? '最終章' : `第${i + 1}章`} ${ch.name}`, s: ch.line } });
  });
  if (chs.length) S.push({ id: 'c_ending', ev: 'end', cat: 'ストーリー', name: `エンディング「${cfg.endingName || '物語の終わり'}」`, desc: cfg.ending || '最終章に到達した', hint: '最終章までたどり着くと…', lv: 4, test: c => c.final, fx: { c: 'rainbow', p: ['fireworks', 'confetti', 'wave'], snd: 'royal', b: 'THE END', s: cfg.ending || '' } });
  return S;
}

/* ---------- Core: ゲーム全体の進行 ---------- */
const Core = {
  cfg: null, state: 'boot', score: 0, best: 0, plays: 0, chapter: 0, paused: false,
  timeScale: 1, slowT: 0, hitT: 0, errCount: 0, lastErrAt: 0, settings: null, _last: 0, last: null, dexFrom: 'title', resultAt: 0, storyTm: 0,

  /** 各ゲームから呼ぶ初期化 */
  init(cfg) {
    this.cfg = cfg;
    Store.setNs('arcade:' + cfg.id);
    const rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.settings = Object.assign({ sound: true, reduce: rm, vib: true }, Store.get('settings', {}));
    this.applySettings();
    document.documentElement.style.setProperty('--acc', cfg.color || '#ffd54a');
    FX.init(); BG.init(); Banner.el = U.$('#banner');
    Specials.load(); Specials.define(cfg.specials || []); Specials.define(commonSpecials(cfg));
    this.best = Store.get('best', 0); this.plays = Store.get('plays', 0);
    this.buildUI();
    BG.set(cfg.chapters[0].theme, true);
    const unlock = () => Sound.init();
    addEventListener('pointerdown', unlock, { capture: true, passive: true });
    addEventListener('keydown', unlock, { capture: true });
    addEventListener('keydown', e => this.onKey(e));
    addEventListener('resize', () => { FX.resize(); BG.resize(); cfg.onResize && cfg.onResize(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); });
    if (cfg.setup) cfg.setup();
    this.showTitle();
    this._last = U.now(); requestAnimationFrame(t => this.frame(t));
  },

  frame(t) {
    let dt = (t - this._last) / 1000; this._last = t; if (!(dt > 0)) dt = 0; dt = Math.min(dt, 0.05);
    try {
      if (this.slowT > 0) { this.slowT -= dt; if (this.slowT <= 0) this.timeScale = 1; }
      const gdt = dt * this.timeScale;
      BG.draw(dt);
      if (this.state === 'play' && !this.paused) { if (this.hitT > 0) { this.hitT -= dt; this.cfg.draw && this.cfg.draw(); } else this.cfg.update && this.cfg.update(gdt, dt); }
      else if (this.cfg.idle) this.cfg.idle(dt);
      FX.update(this.state === 'play' ? gdt : dt); FX.draw();
    } catch (e) { this.handleError(e); }
    requestAnimationFrame(tt => this.frame(tt));
  },

  /* ---- 画面UIの組み立て ---- */
  buildUI() {
    const cfg = this.cfg, e = U.esc;
    U.$('#title').innerHTML = `<div class="card">
      <h1 class="logo">${e(cfg.title)}</h1>
      <div class="tagline">${e(cfg.tagline)}</div>
      <div class="rule">${cfg.ruleHtml}</div>
      <p class="prologue">${e(cfg.prologue || '')}</p>
      <button class="btn big pulse" id="btnStart">▶ スタート</button>
      <div class="meta">ハイスコア <b id="tBest">0</b> ・ 演出図鑑 <b id="tDex">0</b></div>
      <div class="row">
        <button class="btn ghost sm" id="btnDex">📖 演出図鑑</button>
        <button class="btn ghost sm" id="btnSound">🔊 音</button>
        <button class="btn ghost sm" id="btnReduce">✨ 点滅ひかえめ</button>
        <button class="btn ghost sm" id="btnVib">📳 振動</button>
      </div>
      <p class="keys">${e(cfg.keyHelp || '')}</p>
      <p class="privacy">記録はこの端末の中だけに保存されます。外部への送信はありません。<br>音・絵はすべてこのファイル内で作られたオリジナルです。</p>
    </div>`;
    U.$('#result').innerHTML = `<div class="card">
      <div class="res-head">RESULT</div>
      <div class="res-ch" id="rCh"></div>
      <div class="res-score" id="rScore" aria-live="polite">0</div>
      <div class="res-unit">${e(cfg.unit || 'SCORE')}</div>
      <div class="res-new" id="rNew" hidden>★ NEW RECORD ★</div>
      <div class="rank"><div class="g" id="rG">A</div><div class="t" id="rT"></div></div>
      <div class="res-story" id="rStory"></div>
      <div class="stats" id="rStats"></div>
      <div class="res-sp-h" id="rSpH"></div>
      <div class="chips" id="rChips"></div>
      <button class="btn big" id="btnRetry">↻ もう一回</button>
      <div class="row">
        <a class="btn dark" id="btnShare" href="#" target="_blank" rel="noopener noreferrer">Xにポスト ↗</a>
        <button class="btn ghost" id="btnDex2">📖 図鑑</button>
        <button class="btn ghost" id="btnTitle">タイトルへ</button>
      </div>
      <div class="res-best">ハイスコア <b id="rBest"></b> ・ プレイ回数 <b id="rPlays"></b></div>
    </div>`;
    U.$('#dex').innerHTML = `<div class="card dex">
      <h2>📖 演出図鑑</h2>
      <div class="dex-sum"><span id="dCount"></span><div class="bar"><i id="dBar"></i></div></div>
      <p class="dex-note">遊ぶほど見つかる特殊演出。未発見のものはヒントだけ表示されます。</p>
      <div class="dex-grid" id="dGrid"></div>
      <div class="row"><button class="btn" id="btnDexBack">もどる</button><button class="btn ghost sm" id="btnReset">記録をリセット</button></div>
    </div>`;
    U.$('#pauseScr').innerHTML = `<div class="card"><div class="logo sm">一時停止</div>
      <button class="btn big" id="btnResume">▶ つづける</button>
      <div class="row"><button class="btn ghost" id="btnQuit">タイトルへ</button></div></div>`;
    U.$('#hud').innerHTML = `<div class="hud-l"><div class="hud-score" id="hudScore">0</div><div class="hud-best">BEST <span id="hudBest">0</span></div></div>
      <div class="hud-m" id="hudMid"></div>
      <div class="hud-r"><div class="hud-btns"><button class="icon-btn" id="btnMute" aria-label="音のオン・オフ">🔊</button><button class="icon-btn" id="btnPause" aria-label="一時停止">Ⅱ</button></div><div id="hudCh"></div></div>`;
    const on = (id, fn) => U.$('#' + id).addEventListener('click', ev => { Sound.init(); fn(ev); });
    on('btnStart', () => this.start());
    on('btnDex', () => this.openDex('title'));
    on('btnDex2', () => { if (this.guard()) this.openDex('result'); });
    on('btnSound', () => this.toggle('sound'));
    on('btnReduce', () => this.toggle('reduce'));
    on('btnVib', () => this.toggle('vib'));
    on('btnRetry', () => { if (this.guard()) this.start(); });
    on('btnTitle', () => { if (this.guard()) this.showTitle(); });
    on('btnDexBack', () => this.closeDex());
    on('btnReset', ev => this.resetData(ev.currentTarget));
    on('btnResume', () => this.resume());
    on('btnQuit', () => { this.paused = false; U.$('#pauseScr').hidden = true; this.state = 'title'; this.cfg.onQuit && this.cfg.onQuit(); this.showTitle(); });
    on('btnPause', () => this.pause());
    on('btnMute', () => this.toggle('sound'));
    U.$('#btnShare').addEventListener('click', ev => { if (!this.guard()) { ev.preventDefault(); return; } Sound.motif('chime', 84); });
    // HUDのボタンを押した時にゲーム側へタップが伝わらないように
    U.$('#hud').addEventListener('pointerdown', ev => ev.stopPropagation());
    this.refreshToggles();
  },
  /** 結果画面直後の誤タップ防止 */
  guard() { return U.now() - this.resultAt > 550; },
  showScreen(id) {
    ['title', 'result', 'dex', 'pauseScr'].forEach(s => U.$('#' + s).hidden = s !== id);
    document.body.classList.toggle('scr', !!id);
    const focus = { title: '#btnStart', result: '#btnRetry', dex: '#btnDexBack', pauseScr: '#btnResume' }[id];
    if (focus) setTimeout(() => { const b = U.$(focus); b && b.focus({ preventScroll: true }); }, 60);
  },
  showTitle() {
    Banner.clear();
    this.state = 'title'; U.$('#hud').hidden = true; this.combo(0); this.story(null);
    U.$('#tBest').textContent = U.fmt(this.best);
    U.$('#tDex').textContent = `${Specials.foundCount()} / ${Specials.total()}`;
    BG.set(this.cfg.chapters[0].theme); BG.flow = 0;
    this.cfg.onTitle && this.cfg.onTitle();
    this.showScreen('title');
  },
  openDex(from) {
    this.dexFrom = from; const found = Specials.foundCount(), total = Specials.total();
    U.$('#dCount').textContent = `${found} / ${total}`;
    U.$('#dBar').style.width = (found / total * 100).toFixed(1) + '%';
    const cats = {}; Specials.list.forEach(s => { (cats[s.cat || 'その他'] = cats[s.cat || 'その他'] || []).push(s); });
    let html = '';
    for (const [cat, arr] of Object.entries(cats)) {
      const f = arr.filter(s => Specials.dex[s.id]).length;
      html += `<div class="dex-cat">${U.esc(cat)}（${f}/${arr.length}）</div>`;
      for (const s of arr) {
        const got = !!Specials.dex[s.id];
        html += got ? `<div class="dex-item on"><span class="lv">${'★'.repeat(s.lv)}</span><div class="nm">${U.esc(s.name)}</div><div class="ds">${U.esc(s.desc || '')}</div></div>`
          : `<div class="dex-item"><span class="lv">${'☆'.repeat(s.lv)}</span><div class="nm">？？？</div><div class="ds">ヒント：${U.esc(s.hint || '？')}</div></div>`;
      }
    }
    U.$('#dGrid').innerHTML = html;
    const rb = U.$('#btnReset'); rb.textContent = '記録をリセット'; rb.dataset.armed = '';
    this.showScreen('dex');
  },
  closeDex() { if (this.dexFrom === 'result') this.showScreen('result'); else this.showTitle(); },
  resetData(btn) {
    if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = '本当に消す？もう一度押す'; return; }
    ['best', 'dex', 'plays'].forEach(k => Store.del(k)); Specials.dex = {}; this.best = 0; this.plays = 0;
    this.cfg.onReset && this.cfg.onReset();
    Toast.show('<b>OK</b>記録をリセットしました'); this.openDex(this.dexFrom);
  },
  toggle(key) {
    this.settings[key] = !this.settings[key]; Store.set('settings', this.settings); this.applySettings(); this.refreshToggles();
    if (key === 'sound' && this.settings.sound) { Sound.init(); MOTIF.chime(79); }
    if (key === 'vib') Haptic.vib(30);
  },
  applySettings() { Sound.on = this.settings.sound; FX.reduce = this.settings.reduce; Haptic.on = this.settings.vib; document.body.classList.toggle('reduce', !!this.settings.reduce); },
  refreshToggles() {
    const set = (id, v, label) => { const b = U.$('#' + id); if (b) { b.setAttribute('aria-pressed', v ? 'true' : 'false'); if (label) b.textContent = label; } };
    set('btnSound', this.settings.sound, this.settings.sound ? '🔊 音 ON' : '🔇 音 OFF');
    set('btnReduce', this.settings.reduce, this.settings.reduce ? '✨ 点滅ひかえめ ON' : '✨ 点滅ひかえめ OFF');
    set('btnVib', this.settings.vib, this.settings.vib ? '📳 振動 ON' : '📳 振動 OFF');
    const m = U.$('#btnMute'); if (m) m.textContent = this.settings.sound ? '🔊' : '🔇';
  },

  /* ---- ゲーム進行 ---- */
  start() {
    Sound.init();
    ['title', 'result', 'dex', 'pauseScr'].forEach(s => U.$('#' + s).hidden = true);
    document.body.classList.remove('scr');
    Banner.clear();
    this.state = 'play'; this.paused = false; this.timeScale = 1; this.slowT = 0; this.hitT = 0;
    this.score = 0; this.best = Store.get('best', 0);
    this.plays = Store.get('plays', 0) + 1; Store.set('plays', this.plays);
    Specials.reset(); BG.clearKeep(); this.chapter = -1;
    U.$('#hud').hidden = false; U.$('#hudBest').textContent = U.fmt(this.best); this.hudScore(false); this.combo(0);
    this.setChapter(0, true);
    MOTIF.up(72);
    const hits = Specials.check('start', { plays: this.plays, now: new Date() }, FX.w / 2, FX.h * 0.4, 2);
    this.cfg.onStart(hits.length);
  },
  /** 章の切り替え（背景・物語・演出） */
  setChapter(i, silent) {

    U.$('#hudCh').textContent = `${i === chs.length - 1 && i > 0 ? '最終章' : `第${i + 1}章`} ${ch.name}`;
    this.story(ch.line);
    if (!silent) Specials.check('chapter', { chapter: i }, FX.w / 2, FX.h * 0.45, 1);

  },
  story(text) {

    b.textContent = text; b.classList.add('on');
    this.storyTm = setTimeout(() => b.classList.remove('on'), 5200);
  },
  /** スコア加算。silent=true の時は数字パターン演出を判定しない（距離などの連続加算用） */
  addScore(d, x, y, silent) {
    if (this.state !== 'play') return;
    const prev = this.score; this.score = Math.max(0, Math.round(this.score + d));
    if (this.score === prev) return;
    this.hudScore(!silent);
    Specials.check('score', { score: this.score, prev, best: this.best, silent: !!silent }, x, y, 1);
  },
  hudScore(pop) { const e = U.$('#hudScore'); e.textContent = U.fmt(this.score); if (pop) { e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); } },
  hudMid(html) { U.$('#hudMid').innerHTML = html; },
  /** コンボ表示（n<2で非表示） */
  combo(n, mult) {
    const e = U.$('#combo'); if (!e) return;
    if (!n || n < 2) { e.className = ''; return; }
    e.style.setProperty('--cc', `hsl(${(40 + n * 11) % 360} 100% 62%)`);
    e.innerHTML = `<div class="n">${n}<small>COMBO</small></div>${mult && mult > 1 ? `<div class="m">×${mult.toFixed(1)}</div>` : ''}`;
    e.className = 'on'; void e.offsetWidth; e.className = 'on bump';
  },
  /** 運だめし（レア演出の抽選） */
  luck(x, y) { return Specials.check('luck', { r: Math.random() }, x, y, 1); },
  slow(dur, scale = 0.35) { this.timeScale = scale; this.slowT = Math.max(this.slowT, dur); },
  hitStop(sec) { this.hitT = Math.max(this.hitT, sec); },
  pause() {
    if (this.state !== 'play' || this.paused) return;
    this.paused = true; this.cfg.onPause && this.cfg.onPause(); this.showScreen('pauseScr');
  },
  resume() {
    if (!this.paused) return;
    this.paused = false; U.$('#pauseScr').hidden = true; document.body.classList.remove('scr'); this._last = U.now();
    this.cfg.onResume && this.cfg.onResume();
  },
  onKey(e) {
    const k = e.key, vis = id => !U.$('#' + id).hidden, onBtn = document.activeElement && /BUTTON|A/.test(document.activeElement.tagName);
    if ((k === 'm' || k === 'M') && !e.repeat) { this.toggle('sound'); return; }
    if (this.state === 'play' && !this.paused) {
      if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); this.pause(); return; }
      if (this.cfg.onKey) this.cfg.onKey(e);
      return;
    }
    if (this.paused) { if ((k === 'Enter' || k === ' ' || k === 'Escape') && !onBtn) { e.preventDefault(); this.resume(); } return; }
    if (vis('dex') && k === 'Escape') { this.closeDex(); return; }
    if (vis('title') && (k === 'Enter' || k === ' ') && !onBtn) { e.preventDefault(); this.start(); return; }
    if (vis('result') && this.guard()) {
      if ((k === 'r' || k === 'R') || ((k === 'Enter' || k === ' ') && !onBtn)) { e.preventDefault(); this.start(); }
    }
  },
  /** ゲーム終了。res: {rank:{g,t}, stats:[[label,value]], story, delay, …ゲーム固有の値} */
  endGame(res = {}) {
    if (this.state !== 'play') return;
    Banner.clear();
    this.state = 'end'; this.paused = false; this.combo(0);
    const prevBest = this.best, score = this.score, isNew = score > prevBest;
    if (isNew) { this.best = score; Store.set('best', score); }
    const r = Object.assign({ score, prevBest, isNew, chapter: this.chapter, final: this.chapter === this.cfg.chapters.length - 1, plays: this.plays }, res);
    this.last = r;
    setTimeout(() => this.showResult(r), r.delay != null ? r.delay : 700);
  },
  showResult(r) {
    const cfg = this.cfg, ch = cfg.chapters[r.chapter];
    U.$('#hud').hidden = true; this.story(null);
    U.$('#rCh').textContent = `${r.final ? '最終章' : `第${r.chapter + 1}章`}「${ch.name}」まで到達`;
    const rk = r.rank || { g: 'A', t: '' };
    U.$('#rG').textContent = rk.g; U.$('#rT').innerHTML = `${U.esc(rk.t)}<small>称号</small>`;
    U.$('#rStory').textContent = r.story || '';
    U.$('#rStats').innerHTML = (r.stats || []).map(([l, v]) => `<div class="stat"><b>${U.esc(v)}</b><span>${U.esc(l)}</span></div>`).join('');
    U.$('#rNew').hidden = true;
    U.$('#rBest').textContent = U.fmt(this.best); U.$('#rPlays').textContent = U.fmt(this.plays);
    this.updateChips();
    this.state = 'result'; this.resultAt = U.now();
    U.$('#btnShare').href = this.shareUrl(r);
    this.showScreen('result');
    const g = U.$('#rG'); g.classList.remove('in'); void g.offsetWidth; g.classList.add('in');
    // スコアのカウントアップ
    const el = U.$('#rScore'), t0 = U.now(), dur = U.clamp(400 + r.score / 40, 500, 1200);
    let lastTick = 0;
    const tick = () => {
      const k = U.clamp((U.now() - t0) / dur, 0, 1), e = 1 - Math.pow(1 - k, 3);
      el.textContent = U.fmt(r.score * e);
      if (U.now() - lastTick > 55 && k < 1) { lastTick = U.now(); Sound.tone(900 + 700 * e, 0.03, { type: 'square', vol: 0.035 }); }
      if (k < 1) requestAnimationFrame(tick); else this.afterCount(r);
    };
    requestAnimationFrame(tick);
  },
  afterCount(r) {
    const rect = U.$('#rScore').getBoundingClientRect(), x = rect.left + rect.width / 2, y = rect.top + rect.height / 2;
    PR.burst(x, y, PAL[r.isNew ? 'royal' : 'gold'], 2); FX.shake(5, 0.25); Sound.motif('tada', 72);
    if (r.isNew) { U.$('#rNew').hidden = false; PR.confetti(0, 0, PAL.rainbow, 3); }
    Specials.check('end', r, x, y + 80, 2);
    this.updateChips(); setTimeout(() => this.updateChips(), 1100);
    U.$('#btnShare').href = this.shareUrl(r);
  },
  updateChips() {
    const ids = Specials.runList, nNew = ids.filter(id => Specials.runNew.has(id)).length;
    U.$('#rSpH').textContent = `今回の特殊演出 ${ids.length}種（NEW ${nNew}） ・ 図鑑 ${Specials.foundCount()}/${Specials.total()}`;
    const show = ids.slice(-(innerHeight < 760 ? 8 : 12));
    U.$('#rChips').innerHTML = show.map(id => `<span class="chip${Specials.runNew.has(id) ? ' new' : ''}">${Specials.runNew.has(id) ? 'NEW ' : ''}${U.esc(Specials.map[id].name)}</span>`).join('') + (ids.length > show.length ? `<span class="chip">ほか${ids.length - show.length}種</span>` : '');
  },
  /** Xの投稿画面URL（Web Intent）。ここで初めて外部（X）に情報が渡る＝ユーザーの操作時のみ */
  shareUrl(r) {
    const cfg = this.cfg;
    const url = cfg.url || (/^https?:$/.test(location.protocol) ? location.href.split('#')[0] : '');
    const text = cfg.shareText ? cfg.shareText(r) : `【${cfg.title}】${U.fmt(r.score)}点！`;
    let q = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);
    if (url) q += '&url=' + encodeURIComponent(url);
    if (cfg.hashtags) q += '&hashtags=' + encodeURIComponent(cfg.hashtags);
    return q;
  },
  dexLine() { return `演出図鑑 ${Specials.foundCount()}/${Specials.total()}`; },
  handleError(e) {
    this.errCount++; console.error(e);
    const n = U.now(); if (n - this.lastErrAt < 5000) return; this.lastErrAt = n;
    const box = U.$('#err'); if (!box) return;
    box.innerHTML = `<b>⚠ 問題が発生しました</b><br>一部の処理でエラーが起きました。遊び続けられない場合は「再読み込み」を押してください。<br><small>${U.esc((e && e.message) || e || '')}</small>
      <div class="row"><button class="btn ghost sm" id="errClose">閉じる</button><button class="btn sm" id="errReload">再読み込み</button></div>`;
    box.hidden = false;
    U.$('#errClose').onclick = () => box.hidden = true;
    U.$('#errReload').onclick = () => location.reload();
  }
};
window.addEventListener('error', ev => Core.handleError(ev.error || new Error(ev.message)));
window.addEventListener('unhandledrejection', ev => Core.handleError(ev.reason));

</script>
<script>
/* ======================= ゲーム本体 ======================= */
(() => {
'use strict';
/* =================================================================
 *  ⑩ フリック・シュート ― 物理フリックゲーム
 *  ・画面を引っぱって離すと、光の玉が反対方向へ飛ぶ（パチンコの要領）
 *  ・灯籠（的）の中心に近いほど高得点。ど真ん中＝PERFECTで玉が1つ戻る
 *  ・壁で跳ね返して当てる「バンクショット」は得点アップ
 *  ・章が進むと、風・動く灯籠・障害物・月面の低重力が登場
 *  ・玉がなくなったら終了（章を進めると玉+2）
 * ================================================================= */

/* ★ 公開URL：ゲームを置いたURLを入れると、Xポストにリンクが付きます（空なら現在のURLを自動使用） */
const GAME_URL = '';

/* ---------- 調整用パラメータ ---------- */
const P = { balls: 10, perfect: 0.2, great: 0.55, restitution: 0.86, minPull: 18 };

/* ---------- 物語：星祭りの旅（7章・灯した数で進む） ---------- */
const CHAPTERS = [
  { at: 0, name: '昼下がりの野原', pal: 'forest', line: '星祭りの夜までに、空の灯籠をすべて灯そう。まずは練習から。',
    theme: { sky: ['#4aa8ff', '#9fd4ff', '#e2f4ff'], deco: ['sun', 'clouds', 'hills'], sun: '#fff3b0', sunY: 0.2, hill: ['#58c46e', '#3a9a52'], cloud: 'rgba(255,255,255,.8)', accent: '#ff9f43' } },
  { at: 4, name: '夕焼けの川辺', pal: 'sunset', line: '川風が吹きはじめた。上の矢印で、風の向きを読もう。',
    theme: { sky: ['#3a1c5a', '#d86a7a', '#ffc27a'], deco: ['sun', 'waves', 'fireflies'], sun: '#ffd27a', sunY: 0.6, water: '#3a2252', waveC: 'rgba(255,200,160,.35)', accent: '#ff7e5f' } },
  { at: 8, name: '祭りの夜', pal: 'fire', line: '祭りばやしが聞こえる。灯籠がゆらゆら動きだした。',
    theme: { sky: ['#0a0820', '#1c1240', '#3a1a40'], deco: ['stars', 'lanterns'], accent: '#ffb03a' } },
  { at: 13, name: '雪の山小屋', pal: 'ice', line: '雪の壁が行く手をはばむ。跳ね返して届けよう。',
    theme: { sky: ['#1b2b44', '#4f6f96', '#bcd0e6'], deco: ['mountains', 'snow'], mount: '#2a3a52', accent: '#7fdcff' } },
  { at: 18, name: '雷雲の上', pal: 'neon', line: '強い風と稲妻。玉の軌道を信じて。',
    theme: { sky: ['#06070f', '#1a1f33', '#2c3450'], deco: ['clouds', 'lightning', 'rain'], cloud: 'rgba(120,130,170,.35)', accent: '#c8f4ff' } },
  { at: 24, name: '月面', pal: 'mono', line: '重力が軽い！玉がふわりと遠くまで飛んでいく。',
    theme: { sky: ['#000000', '#0b0a14', '#15121f'], deco: ['stars', 'earth', 'bigmoon'], accent: '#e1d5ff' } },
  { at: 30, name: '星の海', pal: 'galaxy', line: '灯した灯籠が天の川になった。星祭りの夜がはじまる。',
    theme: { sky: ['#06001a', '#22093f', '#06001a'], deco: ['galaxy', 'stars', 'sparkles'], gal: ['#ffb03a', '#ff80ab', '#b388ff'], accent: '#ffd54a' } },
];
const chapterFor = n => { let i = 0; CHAPTERS.forEach((c, k) => { if (n >= c.at) i = k; }); return i; };

/* ---------- 描画と状態 ---------- */
const G = { cv: null, cx: null, W: 0, H: 0, dpr: 1, PW: 0, X0: 0, bx: 0, by: 0, br: 10, g: 1000, vmax: 1500, maxPull: 150 };
let S = {}, hintEl, hintTm = 0;
function resize() {
  const cv = G.cv; G.dpr = Math.min(2, devicePixelRatio || 1); G.W = innerWidth; G.H = innerHeight;
  cv.width = Math.round(G.W * G.dpr); cv.height = Math.round(G.H * G.dpr); G.cx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  G.PW = Math.min(G.W, 560); G.X0 = (G.W - G.PW) / 2; G.bx = G.W / 2; G.by = G.H - Math.max(100, G.H * 0.15);
  G.br = Math.max(9, G.PW * 0.032); G.g = G.H * 1.45; G.vmax = Math.sqrt(2 * G.g * (G.by - 30)) * 1.08; G.maxPull = Math.min(G.PW * 0.42, G.H * 0.26);
  if (S.T && S.st !== 'idle') { S.T.x = U.clamp(S.T.x, G.X0 + S.T.R, G.X0 + G.PW - S.T.R); }
}
function resetState() {
  S = { st: 'idle', balls: P.balls, hits: 0, throws: 0, combo: 0, maxCombo: 0, perfStreak: 0, perfects: 0, missStreak: 0, bankHits: 0, windStreak: 0,
    T: null, ball: null, trail: [], wind: 0, windAcc: 0, obstacles: [], drag: null, aim: { ang: 90, pow: 0.7, kb: false }, nextAt: 0, needTarget: false, lastTick: 0, score0: 0 };
}
resetState();
const grav = () => G.g * (Core.chapter === 5 ? 0.6 : 1);

/* ---------- 的（灯籠） ---------- */
function newTarget() {
  const ch = Math.max(0, Core.chapter), R = G.PW * Math.max(0.075, 0.12 - ch * 0.007);
  const top = 100 + R, bottom = Math.max(top + 10, Math.min(G.H * 0.56, G.by - 210));
  let x = U.rand(G.X0 + R + 12, G.X0 + G.PW - R - 12); const y = U.rand(top, bottom);
  const moving = ch >= 2 && Math.random() < 0.3 + ch * 0.07; let amp = 0;
  if (moving) { x = G.X0 + G.PW / 2 + U.rand(-1, 1) * G.PW * 0.08; amp = Math.min(U.rand(0.15, 0.32) * G.PW, G.PW / 2 - R - 14 - Math.abs(x - G.bx)); }
  S.T = { x, y, R, base: x, amp, spd: U.rand(0.7, 1.4), ph: U.rand(6.28), moving, gold: S.hits >= 2 && Math.random() < 0.08, born: BG.t, lit: 0 };
  if (moving) S.T.x = x + Math.sin(S.T.ph) * amp;
  S.obstacles = [];
  if (ch >= 3 && Math.random() < 0.55) {
    const oy = U.rand(y + R + 50, G.by - 130);
    if (oy < G.by - 120) { const w = G.PW * U.rand(0.22, 0.36), lx = G.bx + (S.T.base - G.bx) * ((G.by - oy) / (G.by - y)); S.obstacles.push({ x: U.clamp(lx - w / 2 + U.rand(-w * 0.4, w * 0.4), G.X0 + 4, G.X0 + G.PW - w - 4), y: oy, w, h: 16 }); }
  }
  S.wind = ch >= 1 ? U.clamp(U.rand(-1, 1) * Math.min(1, 0.35 + ch * 0.12) * (ch === 4 ? 1.3 : 1), -1, 1) : 0;
  if (Math.abs(S.wind) < 0.08) S.wind = 0;
  S.windAcc = S.wind * G.PW * 0.35;
  PR.ring(S.T.x, S.T.y, S.T.gold ? PAL.gold : [CHAPTERS[ch].theme.accent, '#fff'], 1);
  Sound.tone(Sound.hz(76), 0.12, { vol: 0.08 }); Sound.tone(Sound.hz(83), 0.12, { vol: 0.06, delay: 0.06 });
}

/* ---------- 入力：引っぱって離す ---------- */
function pull() {
  if (S.aim.kb) { const a = S.aim.ang * Math.PI / 180, L = S.aim.pow * G.maxPull; return { dx: -Math.cos(a) * L, dy: Math.sin(a) * L, pow: S.aim.pow }; }
  if (!S.drag) return null;

  if (L > G.maxPull) { dx *= G.maxPull / L; dy *= G.maxPull / L; }
  return { dx, dy, pow: Math.min(1, L / G.maxPull) };
}
function vel(pu) { return { vx: -pu.dx / G.maxPull * G.vmax, vy: -pu.dy / G.maxPull * G.vmax }; }
function onDown(e) {
  if (Core.state !== 'play' || Core.paused || S.st !== 'aim' || e.button > 0) return;
  e.preventDefault(); try { G.cv.setPointerCapture(e.pointerId); } catch (er) { }
  S.drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: e.clientX, cy: e.clientY }; S.aim.kb = false; S.lastTick = 0;
  Sound.tone(260, 0.05, { type: 'triangle', vol: 0.06 });
}
function onMove(e) {
  if (!S.drag || e.pointerId !== S.drag.id) return;
  S.drag.cx = e.clientX; S.drag.cy = e.clientY;
  const pu = pull(), step = Math.floor(pu.pow * 10);
  if (step !== S.lastTick) { S.lastTick = step; Sound.tone(220 + pu.pow * 700, 0.03, { type: 'triangle', vol: 0.05 }); if (step % 3 === 0) Haptic.vib(4); }
}
function onUp(e) {
  if (!S.drag || e.pointerId !== S.drag.id) return;
  const pu = pull(); S.drag = null;
  if (!pu || Math.hypot(pu.dx, pu.dy) < P.minPull) return;
  launch(pu);
}
function launch(pu) {
  if (S.st !== 'aim') return;
  const v = vel(pu);
  S.balls--; S.throws++; S.st = 'fly'; S.trail = [];
  S.ball = { x: G.bx, y: G.by, vx: v.vx, vy: v.vy, vx0: v.vx, t: 0, bounces: 0, walls: new Set(), obs: 0, sky: false, minD: 1e9, pow: pu.pow };
  Sound.noise(0.25, { freq: 700 + pu.pow * 1500, vol: 0.18, sweep: 3000 + pu.pow * 3000 }); Sound.tone(300 + pu.pow * 500, 0.12, { type: 'triangle', slide: 900 + pu.pow * 900, vol: 0.1 });
  for (let i = 0; i < 14; i++) FX.spawn({ x: G.bx, y: G.by, vx: v.vx * 0.15 + U.rand(-90, 90), vy: v.vy * 0.15 + U.rand(-90, 90), life: 0.4, size: 2.5, color: CHAPTERS[Core.chapter].theme.accent, shape: 'spark', drag: 0.9 });
  FX.shake(1 + pu.pow * 3, 0.12); Haptic.vib(12);
  hintEl.classList.remove('on'); hudBalls();
  Specials.check('throw', { ch: Core.chapter, r: Math.random(), throws: S.throws }, G.X0 + G.PW / 2, G.H * 0.3, 1);
}

/* ---------- 物理 ---------- */
function segDist(x0, y0, x1, y1, px, py) { const dx = x1 - x0, dy = y1 - y0, L = dx * dx + dy * dy; let t = L ? ((px - x0) * dx + (py - y0) * dy) / L : 0; t = U.clamp(t, 0, 1); return Math.hypot(x0 + dx * t - px, y0 + dy * t - py); }
function stepBall(dt) {
  const b = S.ball, T = S.T, n = 4, h = dt / n, gr = grav();
  for (let i = 0; i < n; i++) {
    const px = b.x, py = b.y;
    b.vx += S.windAcc * h; b.vy += gr * h; b.x += b.vx * h; b.y += b.vy * h; b.t += h;
    if (b.x < G.X0 + G.br) { b.x = G.X0 + G.br; b.vx = Math.abs(b.vx) * P.restitution; bounce('L'); }
    if (b.x > G.X0 + G.PW - G.br) { b.x = G.X0 + G.PW - G.br; b.vx = -Math.abs(b.vx) * P.restitution; bounce('R'); }
    for (const o of S.obstacles) {
      const cx = U.clamp(b.x, o.x, o.x + o.w), cy = U.clamp(b.y, o.y, o.y + o.h), dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
      if (d2 < G.br * G.br) {
        const d = Math.sqrt(d2) || 0.001; let nx = dx / d, ny = dy / d; if (d2 === 0) { nx = 0; ny = b.vy > 0 ? -1 : 1; }
        b.x = cx + nx * G.br; b.y = cy + ny * G.br; const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= (1 + 0.8) * vn * nx; b.vy -= (1 + 0.8) * vn * ny; } b.obs++; bounce('O');
      }
    }
    if (b.y < 0) b.sky = true;
    if (T && !T.lit) { const d = segDist(px, py, b.x, b.y, T.x, T.y); b.minD = Math.min(b.minD, d); if (d < T.R) { const sx = b.x - px, sy = b.y - py, L = Math.hypot(sx, sy) || 1; hitTarget(Math.min(d, Math.abs(sx * (T.y - py) - sy * (T.x - px)) / L)); return; } }
  }
  S.trail.push({ x: b.x, y: b.y }); if (S.trail.length > 22) S.trail.shift();
  if (b.y > G.H + 60 || b.t > 6 || b.x < -200 || b.x > G.W + 200) missShot();
}
function bounce(side) {
  const b = S.ball; b.bounces++; if (side !== 'O') b.walls.add(side);
  Sound.tone(520 + b.bounces * 120, 0.06, { type: 'square', vol: 0.06 });
  PR.burst(b.x, b.y, [CHAPTERS[Core.chapter].theme.accent, '#fff'], 1); FX.shake(2, 0.08); Haptic.vib(6);
}

/* ---------- 命中・はずれ ---------- */
function hitTarget(d) {
  const b = S.ball, T = S.T, acc = d / T.R, ch = Core.chapter, wasLast = S.balls === 0;
  const grade = acc < P.perfect ? 'PERFECT' : acc < P.great ? 'GREAT' : 'GOOD', perfect = grade === 'PERFECT', dead = acc < 0.05;
  S.hits++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo); S.missStreak = 0;
  if (perfect) { S.perfects++; S.perfStreak++; S.balls++; } else S.perfStreak = 0;
  if (b.bounces > 0) S.bankHits++;
  S.windStreak = Math.abs(S.wind) >= 0.5 ? S.windStreak + 1 : 0;
  const mult = 1 + Math.min(3, (S.combo - 1) * 0.25), bank = 1 + 0.5 * Math.min(3, b.bounces);
  const pts = Math.round((perfect ? 500 : grade === 'GREAT' ? 300 : 150) * mult * bank * (T.gold ? 3 : 1) * (T.moving ? 1.3 : 1) * (dead ? 1.5 : 1));
  T.lit = BG.t; S.ball = null; S.st = 'wait'; S.nextAt = U.now() + 750; S.needTarget = true;
  /* --- 手ざわりの演出 --- */
  const pal = T.gold ? PAL.gold : PAL[CHAPTERS[ch].pal], lv = perfect ? 3 : grade === 'GREAT' ? 2 : 1;
  PR.burst(T.x, T.y, pal, lv + (dead ? 1 : 0)); PR.ring(T.x, T.y, pal, lv);
  if (perfect) { PR.shock(T.x, T.y, pal); PR.stars(T.x, T.y, PAL.gold, 2); FX.flash(pal[0], 0.2); Core.hitStop(dead ? 0.12 : 0.08); }
  FX.shake(2 + lv * 2.5, 0.2);
  MOTIF.bell(penta(Math.min(S.combo, 12), 64)); Sound.noise(0.08, { freq: 5000, vol: 0.12 }); Haptic.vib(perfect ? [20, 30, 40] : 18);
  FX.text(T.x, T.y - T.R - 10, dead ? 'ど真ん中!!' : grade + (b.bounces ? ` BANK×${b.bounces}` : ''), perfect ? '#ffd54a' : '#fff', perfect ? 32 : 26, { vy: -90 });
  FX.text(T.x, T.y + 10, `+${U.fmt(pts)}`, '#fff', 24, { vy: -60, life: 0.9 });
  if (perfect) FX.text(G.bx, G.by - 50, '+1 玉', '#5effc8', 22);
  BG.addKeep('lantern', { color: T.gold ? '#ffd54a' : U.pick(pal) });
  Core.combo(S.combo, mult);
  const nearWall = T.x - G.X0 < T.R * 1.7 || G.X0 + G.PW - T.x < T.R * 1.7;
  const against = Math.abs(S.wind) >= 0.6 && Math.abs(b.vx0) > 60 && Math.sign(S.wind) !== Math.sign(b.vx0);
  Specials.check('hit', { grade, perfect, acc, dead, combo: S.combo, mult, perfStreak: S.perfStreak, perfects: S.perfects, bounces: b.bounces, walls: b.walls.size, obs: b.obs,
    moving: T.moving, gold: T.gold, wind: Math.abs(S.wind), noWind: S.wind === 0 && ch >= 1, against, sky: b.sky, rising: b.vy < 0, pow: b.pow, flight: b.t, last: wasLast,
    balls: S.balls, hits: S.hits, ty: T.y / G.H, nearWall, ch, bankHits: S.bankHits, windStreak: S.windStreak }, T.x, T.y - 40, 2);
  Core.addScore(pts, T.x, T.y);
  Core.luck(T.x, T.y);
  const nc = chapterFor(S.hits);
  if (nc !== Core.chapter) { Core.setChapter(nc); S.balls += 2; setTimeout(() => FX.text(G.bx, G.by - 80, '章クリア +2 玉', '#5effc8', 24), 400); }
  hudBalls(true);
}
function missShot() {
  const b = S.ball, T = S.T; S.ball = null;
  S.combo = 0; S.perfStreak = 0; S.missStreak++; S.windStreak = 0; Core.combo(0);

  FX.text(T ? T.x : G.bx, T ? T.y + T.R + 26 : G.H / 2, near ? 'おしい！' : 'MISS', near ? '#ffd54a' : '#c9cbe8', 24);
  Sound.tone(300, 0.2, { type: 'triangle', slide: 160, vol: 0.1 });
  Specials.check('miss', { near, missStreak: S.missStreak, throws: S.throws, minD: b.minD }, G.bx, G.H * 0.4, 1);
