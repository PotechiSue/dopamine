}
function finish() {
  const s = Core.score, ch = Core.chapter;
  const g = s >= 40000 ? 'S+' : s >= 25000 ? 'S' : s >= 14000 ? 'A' : s >= 7000 ? 'B' : s >= 2500 ? 'C' : 'D';
  const titles = ['野原の見習い', '川辺の投げ手', '祭りの灯籠師', '雪山の名手', '雷雲の射手', '月面の投てき手', '星の海の灯り手'];
  const accRate = S.throws ? Math.round(S.hits / S.throws * 100) : 0;
  const story = ch === CHAPTERS.length - 1 ? `灯した灯籠は ${S.hits} 個。夜空に光の川ができ、星祭りがはじまった。` : `灯した灯籠は ${S.hits} 個。星祭りの夜まで、旅はつづく。`;
  Core.endGame({
    delay: 300, rank: { g, t: titles[ch] }, story, hits: S.hits, throws: S.throws, accRate, perfects: S.perfects,
    stats: [['灯した灯籠', S.hits], ['命中率', accRate + '%'], ['PERFECT', S.perfects], ['最大コンボ', S.maxCombo], ['バンク命中', S.bankHits], ['投げた数', S.throws]],
  });
}
function hudBalls(add) { Core.hudMid(`<span class="fs-balls${add ? ' add' : ''}" aria-label="残りの玉${S.balls}"><i></i>× ${S.balls}</span>`); }

/* ---------- 毎フレーム ---------- */
function update(dt) {
  const T = S.T;
  if (T && T.moving && !T.lit) { T.ph += dt * T.spd; T.x = T.base + Math.sin(T.ph) * T.amp; }
  if (S.st === 'fly') stepBall(dt);
  else if (S.st === 'wait' && U.now() >= S.nextAt) {
    if (S.balls <= 0) { S.st = 'over'; finish(); }
    else { if (S.needTarget) { S.needTarget = false; newTarget(); } S.st = 'aim'; }
  }
  draw();
}
function draw() {
  const c = G.cx, W = G.W, H = G.H, X0 = G.X0, PW = G.PW, t = BG.t, ch = Math.max(0, Core.chapter), acc = CHAPTERS[ch].theme.accent;
  c.clearRect(0, 0, W, H);
  // 壁
  c.globalCompositeOperation = 'lighter'; c.strokeStyle = acc; c.lineWidth = 3; c.globalAlpha = 0.55;
  c.beginPath(); c.moveTo(X0 + 1.5, 0); c.lineTo(X0 + 1.5, H); c.moveTo(X0 + PW - 1.5, 0); c.lineTo(X0 + PW - 1.5, H); c.stroke();
  // 風の流れ
  if (S.wind) { c.strokeStyle = '#ffffff'; c.lineWidth = 1.5; c.globalAlpha = 0.22 + Math.abs(S.wind) * 0.25; c.beginPath(); for (let i = 0; i < 16; i++) { const x = X0 + wrap(i * 0.383 * PW + t * S.wind * 260, PW), y = 110 + i * (H * 0.55 / 16), L = 10 + Math.abs(S.wind) * 26; c.moveTo(x, y); c.lineTo(x + Math.sign(S.wind) * L, y); } c.stroke(); }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  // 障害物（雪の壁）
  for (const o of S.obstacles) {
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.25; c.fillStyle = acc; roundRect(c, o.x - 5, o.y - 5, o.w + 10, o.h + 10, 12); c.fill();
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.fillStyle = '#e8f4ff'; roundRect(c, o.x, o.y, o.w, o.h, 8); c.fill();
    c.strokeStyle = acc; c.lineWidth = 2; roundRect(c, o.x, o.y, o.w, o.h, 8); c.stroke();
  }
  // 灯籠（的）
  const T = S.T;
  if (T) {
    let x = T.x, y = T.y, a = 1, sc = 1;
    if (T.lit) { const k = Math.min(1, (t - T.lit) / 0.75); y -= k * k * 120; a = 1 - k; sc = 1 + k * 0.3; }
    else { const k = Math.min(1, (t - T.born) / 0.3); sc = 0.5 + 0.5 * (1 - Math.pow(1 - k, 3)); }
    if (a > 0) {
      const R = T.R * sc, col = T.gold ? '#ffd54a' : acc;
      c.globalAlpha = a;
      c.globalCompositeOperation = 'lighter';
      const rg = c.createRadialGradient(x, y, R * 0.2, x, y, R * 1.9); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
      c.globalAlpha = a * (T.lit ? 0.9 : 0.4); c.fillStyle = rg; c.beginPath(); c.arc(x, y, R * 1.9, 0, 6.283); c.fill();
      c.globalCompositeOperation = 'source-over'; c.globalAlpha = a;
      c.fillStyle = 'rgba(10,10,30,.55)'; c.beginPath(); c.arc(x, y, R, 0, 6.283); c.fill();
      c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(x, y, R, 0, 6.283); c.stroke();
      c.fillStyle = col; c.globalAlpha = a * 0.55; c.beginPath(); c.arc(x, y, R * P.great, 0, 6.283); c.fill();
      c.globalAlpha = a; c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, R * P.perfect, 0, 6.283); c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.globalAlpha = a * (0.3 + 0.2 * Math.sin(t * 4)); c.beginPath(); c.arc(x, y, R * (1.08 + 0.05 * Math.sin(t * 4)), 0, 6.283); c.stroke();
      if (T.gold) { c.globalAlpha = a; c.fillStyle = '#fff'; c.font = `900 ${Math.round(R * 0.5)}px system-ui,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('×3', x, y - R - 14); }
      if (T.moving && !T.lit) { c.globalAlpha = 0.5; c.fillStyle = '#fff'; c.font = `900 ${Math.round(R * 0.4)}px system-ui,sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('◀ ▶', x, y + R + 14); }
      c.globalAlpha = 1;
    }
  }
  // 風のメーター
  if (ch >= 1 && S.st !== 'idle') {
    const y = 96, cx = X0 + PW / 2, L = Math.abs(S.wind) * 60;
    c.fillStyle = 'rgba(0,0,0,.4)'; roundRect(c, cx - 78, y - 15, 156, 30, 15); c.fill();
    c.fillStyle = '#fff'; c.font = '800 13px system-ui,sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('風', cx - 68, y);
    if (S.wind) { c.strokeStyle = Math.abs(S.wind) > 0.6 ? '#ff9f43' : '#7fdcff'; c.lineWidth = 4; c.lineCap = 'round'; const sx = cx + 10 - Math.sign(S.wind) * L / 2, ex = cx + 10 + Math.sign(S.wind) * L / 2; c.beginPath(); c.moveTo(sx, y); c.lineTo(ex, y); c.lineTo(ex - Math.sign(S.wind) * 8, y - 6); c.moveTo(ex, y); c.lineTo(ex - Math.sign(S.wind) * 8, y + 6); c.stroke(); }
    else { c.textAlign = 'center'; c.fillText('なし', cx + 10, y); }
  }
  // 発射台とゴム
  const pu = S.st === 'aim' ? pull() : null, post = PW * 0.09;
  const rx = pu ? G.bx + pu.dx * 0.55 : G.bx, ry = pu ? G.by + pu.dy * 0.55 : G.by + (S.st === 'aim' ? Math.sin(t * 3) * 2 : 0);
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(G.bx - post, G.by - 6); c.lineTo(rx, ry); c.lineTo(G.bx + post, G.by - 6); c.stroke();
  c.fillStyle = acc; [G.bx - post, G.bx + post].forEach(px => { roundRect(c, px - 5, G.by - 14, 10, 50, 5); c.fill(); });
  // 予測線（最初の0.3秒だけ。風は含まない＝読みが腕の見せどころ）
  if (pu && Math.hypot(pu.dx, pu.dy) >= P.minPull) {
    const v = vel(pu); let x = G.bx, y = G.by, vx = v.vx, vy = v.vy; const gr = grav();
    c.fillStyle = '#fff';
    for (let i = 1; i <= 9; i++) { const dt = 0.035; vy += gr * dt; x += vx * dt; y += vy * dt; c.globalAlpha = 0.85 - i * 0.08; c.beginPath(); c.arc(x, y, 3.2 - i * 0.2, 0, 6.283); c.fill(); }
    c.globalAlpha = 1;
    c.fillStyle = '#fff'; c.font = '900 14px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText(`${Math.round(pu.pow * 100)}%`, rx, ry + G.br + 18);
  }
  // 玉の軌跡と玉
  c.globalCompositeOperation = 'lighter';
  S.trail.forEach((q, i) => { const k = i / S.trail.length; c.globalAlpha = k * 0.5; c.fillStyle = acc; c.beginPath(); c.arc(q.x, q.y, G.br * (0.3 + 0.7 * k), 0, 6.283); c.fill(); });
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  const b = S.ball, bx = b ? b.x : rx, by = b ? b.y : ry;
  if (b || (S.st === 'aim' && S.balls > 0)) {
    const rg = c.createRadialGradient(bx, by, 0, bx, by, G.br * 2.6); rg.addColorStop(0, acc); rg.addColorStop(1, 'rgba(0,0,0,0)');
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.55; c.fillStyle = rg; c.beginPath(); c.arc(bx, by, G.br * 2.6, 0, 6.283); c.fill();
    c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
    const cg = c.createRadialGradient(bx - G.br * 0.3, by - G.br * 0.3, 1, bx, by, G.br); cg.addColorStop(0, '#fff'); cg.addColorStop(0.55, '#fff3c4'); cg.addColorStop(1, acc);
    c.fillStyle = cg; c.beginPath(); c.arc(bx, by, G.br, 0, 6.283); c.fill();
  }
}

/* =================================================================
 *  特殊演出（このゲーム固有）。共通演出と合わせて100種以上。

const SP = [];
const sp = (id, ev, cat, name, desc, hint, lv, test, fx, rep) => SP.push({ id: 'fs_' + id, ev, cat, name, desc, hint, lv, test, fx, rep });
const A = '命中の精度', B = 'トリックショット', CB = 'コンボ', WN = '風と力', MS = 'はずれ', ST = '旅の出来事', E = '結果';
/* --- 命中の精度 --- */
sp('perf1', 'hit', A, 'BULLSEYE', 'はじめて中心（PERFECT）に命中', '灯籠の白い中心を狙う', 2, c => c.perfect && c.perfects === 1, { c: 'gold', p: ['ring', 'stars'], snd: 'tada', s: '中心に当てると玉が1つ戻る' });
sp('dead', 'hit', A, '針の穴', '中心のさらに真ん中（誤差5%以内）に命中', 'ど真ん中の、さらに真ん中', 4, c => c.dead, { c: 'royal', p: ['implode', 'stars'], snd: 'power', css: 'fx-bright', s: '神がかった一投' });
sp('perf3', 'hit', A, '三連星', 'PERFECTを3回連続', 'PERFECTを3連続', 3, c => c.perfStreak === 3, { c: 'ice', p: ['stars', 'orbit'], snd: 'star' });
sp('perf5', 'hit', A, '五連星', 'PERFECTを5回連続', 'PERFECTを5連続', 4, c => c.perfStreak === 5, { c: 'rainbow', p: ['fireworks', 'orbit'], snd: 'royal' });
sp('perf10t', 'hit', A, '名人の証', '1プレイでPERFECT10回', 'PERFECTを10回', 3, c => c.perfect && c.perfects === 10, { c: 'gold', p: ['stars', 'confetti'], snd: 'fanfare' });
sp('edge', 'hit', A, 'かすった！', '灯籠のふちギリギリに命中', 'ふちっこに当てる', 1, c => c.acc > 0.9, { c: 'sunset', p: ['ring'], snd: 'wow', b: 'かすり命中！' }, true);
sp('high', 'hit', A, '高所の灯', '画面のかなり上の灯籠に命中', '高いところの灯籠', 2, c => c.ty < 0.2, { c: 'ice', p: ['beam'], snd: 'up' });
sp('low', 'hit', A, '低空の灯', '低い位置の灯籠に命中', '低いところの灯籠', 1, c => c.ty > 0.5, { c: 'forest', p: ['ring'], snd: 'chime' });
sp('wall', 'hit', A, '壁ぎわの灯', '壁にくっついた灯籠に命中', '壁ぎわの灯籠', 2, c => c.nearWall, { c: 'mint', p: ['cross'], snd: 'chime' });
/* --- トリックショット --- */
sp('bank1', 'hit', B, 'バンクショット', '壁で跳ね返して命中', '壁を使う', 2, c => c.bounces === 1, { c: 'neon', p: ['cross', 'ring'], snd: 'zap', b: 'BANK SHOT!' });
sp('bank2', 'hit', B, 'ダブルバンク', '2回跳ね返して命中', '2回跳ね返す', 3, c => c.bounces === 2, { c: 'neon', p: ['cross', 'stars'], snd: 'spin', b: 'DOUBLE BANK!!' });
sp('bank3', 'hit', B, 'ビリヤードの神', '3回以上跳ね返して命中', '跳ね返しまくる', 4, c => c.bounces >= 3, { c: 'rainbow', p: ['spiral', 'fireworks'], snd: 'royal', css: 'fx-tilt' });
sp('both', 'hit', B, '両壁バンク', '左右両方の壁に当てて命中', '左の壁と右の壁', 3, c => c.walls === 2, { c: 'ice', p: ['wave'], snd: 'spin' });
sp('bankp', 'hit', B, '曲芸師', 'バンクショットでPERFECT', '跳ね返して中心へ', 3, c => c.bounces >= 1 && c.perfect, { c: 'gold', p: ['orbit', 'stars'], snd: 'fanfare' });
sp('bank5', 'hit', B, 'クッションの達人', '1プレイでバンク命中5回', 'バンクを何度も', 3, c => c.bounces >= 1 && c.bankHits === 5, { c: 'neon', p: ['cross', 'confetti'], snd: 'fanfare' });
sp('obs', 'hit', B, '雪壁はね返し', '雪の壁に当てて跳ね返して命中', '障害物を利用する', 3, c => c.obs >= 1, { c: 'ice', p: ['snow', 'ring'], snd: 'bell' });
sp('sky', 'hit', B, '天空からの一撃', '画面の上を越えてから落ちて命中', '画面の外まで高く', 3, c => c.sky, { c: 'galaxy', p: ['comet', 'beam'], snd: 'magic', s: '空の彼方から' });
sp('rising', 'hit', B, '一直線', '上昇中の玉で命中（ほぼ直線）', '勢いよくまっすぐ', 2, c => c.rising, { c: 'fire', p: ['beam'], snd: 'laser' });
sp('move1', 'hit', B, '動く灯籠を射抜く', '動いている灯籠に命中', '動く灯籠', 2, c => c.moving, { c: 'candy', p: ['ring', 'cross'], snd: 'up' });
sp('movep', 'hit', B, '流鏑馬', '動く灯籠にPERFECT', '動く灯籠の中心', 3, c => c.moving && c.perfect, { c: 'fire', p: ['stars', 'shock'], snd: 'fanfare' });
sp('gold1', 'hit', B, '金色の灯籠', '金色の灯籠に命中（3倍）', '金色の灯籠', 2, c => c.gold, { c: 'gold', p: ['stars', 'fountain'], snd: 'sparkle' });
sp('goldp', 'hit', B, '黄金の一撃', '金色の灯籠にPERFECT', '金色の中心', 3, c => c.gold && c.perfect, { c: 'gold', p: ['fireworks', 'stars'], snd: 'royal' });
/* --- 風と力 --- */
sp('wind', 'hit', WN, '風読み', '強い風の中で命中', '強い風の時に', 2, c => c.wind >= 0.7, { c: 'mint', p: ['hband'], snd: 'wind' });
sp('against', 'hit', WN, '向かい風を切りさく', '強い向かい風に逆らって命中', '風に逆らって投げる', 3, c => c.against, { c: 'ice', p: ['comet', 'ring'], snd: 'power' });
sp('wind3', 'hit', WN, '風の中の三連', '風が強いまま3回連続命中', '強風の中で連続', 3, c => c.windStreak === 3, { c: 'mint', p: ['spiral'], snd: 'wind' });
sp('nowind', 'hit', WN, '無風の極み', '風のない時にPERFECT', '風がやんだ時に', 2, c => c.noWind && c.perfect, { c: 'mono', p: ['halo'], snd: 'bell', n: 60 });
sp('soft', 'hit', WN, 'ちょい投げ', '力40%未満で命中', 'そっと投げる', 2, c => c.pow < 0.4, { c: 'candy', p: ['glyphs'], ch: '・', snd: 'heart' });
sp('full', 'hit', WN, '全力投球', '力97%以上で命中', '思いきり引っぱる', 2, c => c.pow >= 0.97, { c: 'fire', p: ['shock'], snd: 'boom' });
sp('long', 'hit', WN, '長旅の末', '2.2秒以上飛んでから命中', '長く飛ばす', 2, c => c.flight > 2.2, { c: 'galaxy', p: ['comet'], snd: 'magic' });
sp('quick', 'hit', WN, '瞬撃', '0.35秒以内に命中', 'すぐに当たる', 2, c => c.flight < 0.35, { c: 'ice', p: ['cross'], snd: 'laser' });
sp('moon', 'hit', WN, 'ふわり', '月面の低重力で命中', '月面で', 2, c => c.ch === 5, { c: 'mono', p: ['bubbles'], snd: 'magic', s: '重力が6割の世界' });
/* --- コンボ --- */
[[3, 'mint', 2], [5, 'ice', 2], [10, 'gold', 3], [15, 'galaxy', 4], [20, 'rainbow', 4]].forEach(([n, pal, lv]) =>
  sp('combo' + n, 'hit', CB, `${n}連続命中`, `${n}回つづけて命中`, `${n}回つづけて当てる`, lv, c => c.combo === n, { c: pal, p: lv >= 4 ? ['fireworks', 'stars'] : lv >= 3 ? ['ring', 'stars'] : ['ring', 'burst'], snd: lv >= 3 ? 'fanfare' : 'up', b: `${n} COMBO!` }));
sp('multmax', 'hit', CB, '最大倍率×4', '連続命中の倍率が最大に', '倍率を限界まで', 3, c => c.mult >= 4 && c.combo === 13, { c: 'royal', p: ['implode'], snd: 'power', b: '×4.0 MAX!' });
sp('last', 'hit', CB, 'ラストショット', '最後の1球で命中', '最後の玉で', 3, c => c.last && !c.perfect, { c: 'fire', p: ['ring', 'stars'], snd: 'fanfare', s: '最後の最後で！' });
sp('lastp', 'hit', CB, '奇跡のラスト', '最後の1球でPERFECT（玉が復活）', '最後の玉で中心', 4, c => c.last && c.perfect, { c: 'rainbow', p: ['fireworks'], snd: 'royal' });
sp('stock', 'hit', CB, '玉もち長者', '残りの玉が15個以上になった', '玉をためる', 2, c => c.balls >= 15, { c: 'mint', p: ['fountain'], snd: 'sparkle' });
/* --- 灯した数 --- */
[[1, '最初の灯り', 'gold', 1], [5, '五つの灯', 'sunset', 2], [10, '十の灯', 'fire', 2], [20, '二十の灯', 'galaxy', 3], [30, '三十の灯', 'gold', 3], [40, '灯籠流し', 'rainbow', 4]].forEach(([n, nm, pal, lv]) =>
  sp('lit' + n, 'hit', ST, nm, `灯籠を${n}個灯した`, `灯籠を${n}個灯す`, lv, c => c.hits === n, { c: pal, p: ['fountain', 'sparkle'], snd: lv >= 3 ? 'fanfare' : 'chime', b: nm, s: `${n} 個目の灯籠が空へ` }));
/* --- 旅の出来事（投げた時にまれに） --- */
[['fluff', 0, 'たんぽぽの綿毛', null, 'mono', ['snow']], ['firefly', 1, 'ホタルの群れ', null, 'forest', ['sparkle', 'fountain']], ['hanabi', 2, '打ち上げ花火', null, 'fire', ['fireworks']], ['rabbit', 3, '雪うさぎ', '🐇', 'ice', ['snow']],
 ['thunder', 4, '雷鳴', null, 'ice', ['lightning']], ['earth', 5, '地球の出', null, 'ocean', ['halo', 'glyphs']], ['meteor', 6, '流星群', null, 'galaxy', ['comet', 'comet']]].forEach(([id, ch, nm, emo, pal, parts]) =>
  sp('amb_' + id, 'throw', ST, nm, `「${CHAPTERS[ch].name}」でまれに起きる`, `「${CHAPTERS[ch].name}」でまれに…`, 3, c => c.ch === ch && c.r < 0.05, { c: pal, p: parts, ch: id === 'earth' ? '🌏' : null, snd: id === 'thunder' ? 'thunder' : id === 'hanabi' ? 'boom' : 'bell', emoji: emo, wy: 0.8, s: 'めずらしい出来事！' }));
/* --- はずれ --- */
sp('near', 'miss', MS, 'おしい！', 'あと少しのところで外れた', 'ギリギリ外れると…', 1, c => c.near, { c: 'sunset', p: ['ring'], snd: 'wow' }, true);
sp('miss1', 'miss', MS, '空振り', 'はじめて外した', '外れることもある', 1, c => c.throws <= 3, { c: 'mono', p: ['glyphs'], ch: '…', snd: 'drop' });
sp('slump', 'miss', MS, 'スランプ？', '3回つづけて外した', '外れがつづくと…', 1, c => c.missStreak === 3, { c: 'candy', p: ['glyphs'], ch: '💭', snd: 'drop', s: '深呼吸して、風を読もう' });
/* --- 結果 --- */
sp('perfect', 'end', E, '百発百中', '8投以上して命中率100%', '1回も外さない', 4, c => c.throws >= 8 && c.accRate === 100, { c: 'rainbow', p: ['fireworks', 'confetti'], snd: 'royal' });
sp('sniper', 'end', E, '名射手', '8投以上して命中率80%以上', '命中率80%', 3, c => c.throws >= 8 && c.accRate >= 80, { c: 'gold', p: ['stars'], snd: 'fanfare' });
sp('zero', 'end', E, '次こそ', '1つも灯せずに終了', '…0個？', 1, c => c.hits === 0, { c: 'mono', p: ['ring'], snd: 'chime', s: '引く強さを変えてみよう' });

/* ---------- エンジンに登録 ---------- */
Core.init({
  id: 'flick-shoot', title: 'フリック・シュート', tagline: '引いて、放って、灯せ。', color: '#ff9f43', url: GAME_URL, hashtags: 'フリックシュート',
  ruleHtml: '👆 画面を<b>引っぱって離す</b>と、反対へ光の玉が飛ぶ<br>🏮 灯籠の<b>白い中心</b>に当てるとPERFECT（玉+1）<br>↩ 壁で跳ね返すと得点アップ。玉がなくなったら終了',
  prologue: '星祭りの夜。空に浮かぶ灯籠に光の玉を届けて、祭りの灯りをともしていこう――。',
  keyHelp: 'キーボード：← → で角度 ・ ↑ ↓ で強さ ・ スペース / Enter で発射 ・ P で一時停止 ・ M で音',
  chapters: CHAPTERS, specials: SP, milestones: [2500, 7000, 14000, 25000, 40000],
  endingName: '星祭りの夜', ending: '灯籠が天の川になり、星祭りの夜がはじまった。', unit: 'POINTS',
  setup() {
    document.getElementById('game').innerHTML = '<canvas id="fsCv" aria-label="ゲーム画面：引っぱって離すと玉が飛ぶ"></canvas><div id="fsHint">👆 引っぱって、はなす！</div>';
    G.cv = document.getElementById('fsCv'); G.cx = G.cv.getContext('2d'); hintEl = document.getElementById('fsHint');
    resize();
    G.cv.addEventListener('pointerdown', onDown); G.cv.addEventListener('pointermove', onMove);
    G.cv.addEventListener('pointerup', onUp); G.cv.addEventListener('pointercancel', e => { if (S.drag && e.pointerId === S.drag.id) S.drag = null; });
  },
  onResize: resize,
  onStart() {
    resetState(); newTarget(); S.st = 'aim'; hudBalls();
    hintEl.classList.add('on'); clearTimeout(hintTm); hintTm = setTimeout(() => hintEl.classList.remove('on'), 6000);
  },
  onTitle() { resetState(); hintEl && hintEl.classList.remove('on'); },
  onQuit() { S.st = 'idle'; S.drag = null; },
  onPause() { S.drag = null; },
  onKey(e) {
    const k = e.key; let used = true;
    if (k === 'ArrowLeft') { S.aim.ang = Math.min(170, S.aim.ang + 2); S.aim.kb = true; }
    else if (k === 'ArrowRight') { S.aim.ang = Math.max(10, S.aim.ang - 2); S.aim.kb = true; }
    else if (k === 'ArrowUp') { S.aim.pow = Math.min(1, S.aim.pow + 0.03); S.aim.kb = true; }
    else if (k === 'ArrowDown') { S.aim.pow = Math.max(0.2, S.aim.pow - 0.03); S.aim.kb = true; }
    else if ((k === ' ' || k === 'Enter') && !e.repeat) { if (S.st === 'aim') { S.aim.kb = true; const pu = pull(); launch(pu); } }
    else used = false;
    if (used) e.preventDefault();
  },
  update,
  idle() { if (Core.state === 'title' && G.cx) { if (!S.T) { S.T = { x: G.bx, y: G.H * 0.35, R: G.PW * 0.12, lit: 0, born: -9 }; } draw(); } },
  shareText: r => `【フリック・シュート】${U.fmt(r.score)}点！\n灯籠 ${r.hits}個／命中率 ${r.accRate}%／PERFECT ${r.perfects}回\n称号「${r.rank.t}」(${r.rank.g})\n${Core.dexLine()}`,
});
/* テスト用の自動投てき（コンソールから window.__auto() を呼ぶと、だいたい狙って投げる） */
window.__auto = () => {
  if (S.st !== 'aim' || !S.T) return;
  // 目標へ届く速度を数値的に探索（風は無視）
  let best = null; const gr = grav();
  for (let a = 20; a <= 160; a += 2) for (let p = 0.3; p <= 1; p += 0.02) {
    const r = a * Math.PI / 180, vx = Math.cos(r) * p * G.vmax, vy = -Math.sin(r) * p * G.vmax;
    const tt = (S.T.x - G.bx) / vx; if (!(tt > 0) || tt > 3) continue;
    const y = G.by + vy * tt + 0.5 * gr * tt * tt; const err = Math.abs(y - S.T.y);
    if (!best || err < best.err) best = { a, p, err };
  }
  if (best) { S.aim.ang = best.a; S.aim.pow = best.p + U.rand(-0.02, 0.02); S.aim.kb = true; launch(pull()); }
};
})();
