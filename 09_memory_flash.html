<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07081a">
<meta name="description" content="光る順番を覚えてタップする記憶ゲーム。正解するたび旋律がよみがえる。特殊演出100種以上。">
<meta property="og:title" content="メモリー・フラッシュ">
<meta property="og:description" content="光る順番を覚えてタップする記憶ゲーム。正解するたび旋律がよみがえる。特殊演出100種以上。">
<meta name="twitter:card" content="summary">
<title>メモリー・フラッシュ｜光と音を、覚えて奏でろ。</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307081a'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23b388ff'/%3E%3C/svg%3E">
<!--
  メモリー・フラッシュ — 1ファイル完結のブラウザゲーム
  ・サーバー不要／インストール不要／オフライン動作（このHTMLを開くだけ）
  ・記録は localStorage（この端末内）にのみ保存。外部送信なし
  ・効果音はWebAudioでその場で合成、絵はCanvas/CSSで描画（外部素材なし）
  ・改造するときは、下の <script> 内「ゲーム本体」部分を編集してください
-->
<style>
/* =============================================================
 *  ARCADE CORE — 共通スタイル
 *  色は :root の変数で管理。--acc（アクセント色）は各ゲーム・各章で変わります。
 * ============================================================= */
:root{
  --acc:#ffd54a; --bg:#07081a; --fg:#ffffff; --sub:#c9cbe8;
  --line:rgba(255,255,255,.16); --card:rgba(10,12,34,.86);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit}
#stage{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{position:absolute;inset:0}
#flash{position:fixed;inset:0;pointer-events:none;z-index:29;opacity:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;display:block}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;pointer-events:none;display:flex;align-items:flex-start;gap:10px;
  padding:calc(10px + var(--safe-t)) 12px 18px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0))}
#hud[hidden]{display:none}
.hud-l{min-width:0}
.hud-score{font-size:clamp(28px,7.5vw,42px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 18px var(--acc)}
.hud-score.pop{animation:pop .22s ease-out}
.hud-best{font-size:12px;color:var(--sub);margin-top:5px;font-weight:800;letter-spacing:.04em}
.hud-m{flex:1;display:flex;justify-content:center;align-items:center;gap:4px;font-weight:900;font-size:20px;min-height:44px;text-shadow:0 2px 0 #000}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hud-btns{display:flex;gap:6px}
#hudCh{font-size:12px;font-weight:900;color:var(--acc);text-shadow:0 1px 2px #000;white-space:nowrap;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.icon-btn{pointer-events:auto;min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.45);
  color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.icon-btn:active{transform:scale(.92)}

/* ---------- コンボ表示 ---------- */
#combo{position:absolute;left:50%;top:calc(74px + var(--safe-t));transform:translateX(-50%);z-index:6;pointer-events:none;
  text-align:center;font-weight:900;opacity:0;transition:opacity .2s;--cc:var(--acc)}
#combo.on{opacity:1}
#combo .n{font-size:clamp(26px,7vw,36px);line-height:1;color:#fff;text-shadow:0 0 12px var(--cc),0 0 26px var(--cc),0 3px 0 #000}
#combo .n small{font-size:.45em;letter-spacing:.1em;margin-left:4px}
#combo .m{display:inline-block;margin-top:3px;font-size:14px;padding:2px 10px;border-radius:999px;background:var(--cc);color:#111}
#combo.bump .n{animation:bump .22s ease-out}

/* ---------- 物語のひとこと ---------- */
#storybar{position:absolute;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);width:min(92vw,560px);z-index:4;
  text-align:center;font-size:13px;line-height:1.5;color:#eef;background:rgba(0,0,0,.5);border:1px solid var(--line);
  border-radius:16px;padding:7px 14px;pointer-events:none;opacity:0;transition:opacity .7s}
#storybar.on{opacity:1}

/* ---------- 画面（タイトル／結果／図鑑／一時停止） ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
  background:radial-gradient(ellipse at center,rgba(5,6,22,.45),rgba(3,3,12,.88))}
.screen[hidden]{display:none}
.card{width:min(100%,520px);margin:auto;text-align:center}
.logo{font-size:clamp(40px,12vw,72px);font-weight:900;letter-spacing:-.02em;line-height:1.05;
  background:linear-gradient(180deg,#fff 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px var(--acc));animation:float 3s ease-in-out infinite;padding:4px 0}
.logo.sm{font-size:clamp(30px,9vw,48px)}
.tagline{font-size:clamp(17px,4.6vw,21px);font-weight:900;margin:10px 0 14px}
.rule{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.7;text-align:left}
.rule b{color:var(--acc)}
.prologue{font-size:13px;color:var(--sub);margin:12px 4px;line-height:1.75}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;border:0;
  font-weight:900;font-size:17px;cursor:pointer;color:#111;background:var(--acc);text-decoration:none;
  box-shadow:0 6px 0 rgba(0,0,0,.4),0 0 22px rgba(255,255,255,.12);transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn.big{min-height:64px;font-size:24px;width:100%;margin-top:14px}
.btn.pulse{animation:pulse 1.5s ease-in-out infinite}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line);box-shadow:none}
.btn.dark{background:#000;color:#fff;border:1px solid #555}
.btn.sm{min-height:44px;font-size:14px;padding:0 12px}
.btn[aria-pressed="false"]{opacity:.55}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.meta{font-size:14px;color:var(--sub);margin-top:12px}
.meta b{color:#fff}
.keys{font-size:12px;color:var(--sub);margin-top:10px}
.privacy{font-size:11px;color:#a3a5c8;margin-top:12px;line-height:1.6}

/* 結果画面 */
#result{background:radial-gradient(ellipse at center,rgba(6,7,26,.82),rgba(3,3,12,.95))}
.res-head{font-size:14px;letter-spacing:.4em;color:var(--sub);font-weight:900}
.res-ch{font-size:14px;font-weight:800;color:var(--acc);margin-top:4px}
.res-score{font-size:clamp(56px,18vw,120px);font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 40%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px var(--acc))}
.res-unit{font-size:16px;color:var(--sub);font-weight:800;margin-top:-6px}
.res-new{display:inline-block;margin-top:6px;background:linear-gradient(90deg,#ff3df2,#ffd54a,#3dfcff);color:#111;font-weight:900;
  padding:5px 14px;border-radius:999px;animation:pulse .9s ease-in-out infinite}
.res-new[hidden]{display:none}
.rank{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 6px}
.rank .g{width:66px;height:66px;flex:none;border-radius:18px;font-size:36px;font-weight:900;display:grid;place-items:center;
  background:var(--acc);color:#111;transform:rotate(-7deg);box-shadow:0 0 30px var(--acc)}
.rank .g.in{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.rank .t{font-size:clamp(20px,5.6vw,26px);font-weight:900;text-align:left;line-height:1.25}
.rank .t small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.res-story{font-size:14px;line-height:1.7;margin:8px 0;color:#f2f2ff;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stat{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:7px 4px}
.stat b{display:block;font-size:clamp(15px,4.4vw,20px);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--sub)}
.res-sp-h{font-size:13px;font-weight:800;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:6px 0 4px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.chip.new{background:rgba(255,213,74,.22);border-color:#ffd54a;color:#fff6c8}
.res-best{font-size:12px;color:var(--sub);margin-top:12px}

/* 図鑑 */
.dex h2{font-size:26px;font-weight:900;margin-bottom:8px}
.dex-sum{display:flex;align-items:center;gap:10px;font-weight:900}
.bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#fff);border-radius:99px}
.dex-note{font-size:12px;color:var(--sub);margin:8px 0}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;text-align:left;max-height:58vh;overflow-y:auto;padding:2px;
  -webkit-overflow-scrolling:touch}
.dex-cat{grid-column:1/-1;font-weight:900;color:var(--acc);margin-top:8px;font-size:14px}
.dex-item{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:7px 9px;font-size:13px}
.dex-item.on{border-color:var(--acc);background:rgba(255,255,255,.1)}
.dex-item .nm{font-weight:900}
.dex-item .ds{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.4}
.dex-item .lv{float:right;font-size:10px;color:var(--acc)}

/* ---------- 大見出し演出（バナー） ---------- */
#banner{position:fixed;left:0;right:0;top:33%;z-index:40;text-align:center;pointer-events:none;opacity:0;--bc:#fff}
#banner.show{animation:bannerIn 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
#banner.lv3.show{animation-duration:1.9s}
#banner.lv4.show{animation-duration:2.4s}
#banner .bt{display:inline-block;max-width:100vw;font-size:clamp(28px,8.5vw,52px);font-weight:900;color:#fff;padding:4px 26px;line-height:1.2;
  text-shadow:0 0 12px var(--bc),0 0 28px var(--bc),0 4px 0 rgba(0,0,0,.7);
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.6) 14%,rgba(0,0,0,.6) 86%,transparent)}
#banner.lv4 .bt{font-size:clamp(34px,10.5vw,66px)}
#banner .bs{font-size:clamp(13px,3.7vw,17px);font-weight:800;margin:6px auto 0;max-width:92vw;color:#fff;line-height:1.5;
  text-shadow:0 1px 3px #000,0 0 10px var(--bc)}

/* ---------- 通知 ---------- */
#toasts{position:fixed;bottom:calc(58px + var(--safe-b));left:8px;right:8px;z-index:50;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
body.scr #toasts{bottom:auto;top:calc(8px + var(--safe-t))}
.toast{background:rgba(10,10,30,.86);border:1px solid var(--acc);color:#fff;font-size:13px;padding:7px 11px;border-radius:12px;max-width:100%;
  animation:toastIn .3s ease-out;box-shadow:0 4px 16px rgba(0,0,0,.5);transition:opacity .4s,transform .4s}
.toast b{color:var(--acc);margin-right:4px}
.toast span{color:var(--sub);margin-left:6px;font-size:11px}
.toast.out{opacity:0;transform:translateY(-10px)}

/* ---------- エラー表示 ---------- */
#err{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:100;background:#2a0b14;border:2px solid #ff5a7a;
  border-radius:16px;padding:12px;font-size:14px;line-height:1.6;color:#fff}
#err[hidden]{display:none}

/* ---------- 画面全体のエフェクト ---------- */
.fx-zoom{animation:fxZoom .5s ease-out}
.fx-glitch{animation:fxGlitch .6s steps(2)}
.fx-hue{animation:fxHue 1.2s linear}
.fx-tilt{animation:fxTilt .8s ease-out}
.fx-bright{animation:fxBright .7s ease-out}
.fx-mono{animation:fxMono 1.3s ease-in-out}
body.reduce .fx-glitch,body.reduce .fx-hue,body.reduce .fx-tilt{animation:none}

@keyframes fxZoom{0%{scale:1}25%{scale:1.05}100%{scale:1}}
@keyframes fxGlitch{0%{filter:none;translate:0}20%{filter:hue-rotate(90deg) saturate(2);translate:-6px 0}40%{filter:hue-rotate(-70deg);translate:5px 2px}
  60%{filter:hue-rotate(180deg);translate:-3px -2px}80%{filter:none;translate:2px 0}100%{filter:none;translate:0}}
@keyframes fxHue{to{filter:hue-rotate(360deg)}}
@keyframes fxTilt{30%{rotate:-2deg}60%{rotate:1.5deg}100%{rotate:0deg}}
@keyframes fxBright{30%{filter:brightness(1.5) saturate(1.4)}}
@keyframes fxMono{25%,75%{filter:grayscale(1) contrast(1.25)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-7deg);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.8)}12%{opacity:1;transform:scale(.95)}20%{transform:scale(1)}80%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.04) translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.logo,.btn.pulse,.res-new{animation:none}}
@media (max-height:640px){.prologue{display:none}.btn.big{min-height:56px}}

/* ===== ゲーム固有のスタイル ===== */
/* ⑨ メモリー・フラッシュ */
#mf{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:84px 12px 64px}
#mfLabel{font-size:clamp(22px,6.6vw,34px);font-weight:900;text-align:center;min-height:1.3em;text-shadow:0 2px 0 #000,0 0 14px var(--acc)}
#mfLabel.rev{color:#ffd54a}
#mfLabel.pop{animation:mfPop .35s cubic-bezier(.2,1.6,.4,1)}
#mfBoard{--cell:110px;display:grid;gap:12px;justify-content:center;transition:transform .3s}
#mfBoard.rev{filter:drop-shadow(0 0 14px rgba(255,213,74,.7))}
#mfBoard.in{animation:mfIn .45s cubic-bezier(.2,1.4,.4,1)}
.pn{position:relative;width:var(--cell);height:var(--cell);border:0;border-radius:22%;cursor:pointer;touch-action:none;color:#fff;
  background:#171a3a;background:color-mix(in srgb,var(--c) 26%,#0b0d24);
  box-shadow:inset 0 0 0 3px var(--c),0 7px 0 rgba(0,0,0,.4);
  font-size:calc(var(--cell)*.36);font-weight:900;transition:transform .08s,background .1s,box-shadow .12s,filter .1s}
.pn .sym{display:block;opacity:.8;line-height:1}
.pn .key{position:absolute;left:10%;top:7%;font-size:max(11px,calc(var(--cell)*.11));opacity:.65;font-weight:800}
.pn.lit{background:var(--c);color:#111;transform:scale(1.06);box-shadow:0 0 30px var(--c),0 0 80px var(--c),inset 0 0 0 4px #fff}
.pn.down{transform:scale(.92)}
.pn.wrong{animation:mfShake .4s;background:#5a0e1e;box-shadow:inset 0 0 0 3px #ff4d6d,0 0 30px #ff2e55}
.pn.hint{animation:mfHint .45s 3}
.pn.gold::after{content:'';position:absolute;inset:-6px;border-radius:24%;border:3px solid #ffd54a;box-shadow:0 0 18px #ffd54a;animation:pulse 1.1s infinite;pointer-events:none}
#mfBoard.locked .pn{cursor:default}
#mfDots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:14px;max-width:90vw}
#mfDots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);transition:background .1s,transform .1s}
#mfDots i.on{background:var(--acc);transform:scale(1.25);box-shadow:0 0 10px var(--acc)}
#mfInfo{font-size:13px;color:#dfe0ff;font-weight:800;text-shadow:0 1px 2px #000;min-height:1.2em}
.mf-lives{letter-spacing:2px;font-size:22px}
.mf-lives .on{color:#ff4d6d;text-shadow:0 0 10px #ff4d6d}
.mf-lives .off{color:rgba(255,255,255,.25)}
.mf-lives.hurt{animation:mfShake .4s}
@keyframes mfShake{0%,100%{translate:0}20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:5px 0}}
@keyframes mfHint{50%{background:var(--c);box-shadow:0 0 30px var(--c)}}
@keyframes mfPop{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes mfIn{0%{transform:scale(.6) rotate(-6deg);opacity:0}100%{transform:scale(1);opacity:1}}

</style>
</head>
<body>
<noscript><p style="padding:20px;color:#fff">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>
<div id="stage">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div id="game"></div>
  <div id="hud" hidden></div>
  <div id="combo" aria-hidden="true"></div>
  <div id="storybar" aria-live="polite"></div>
</div>
<div id="flash" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="banner" aria-hidden="true"></div>
<div id="toasts" aria-live="polite"></div>
<section id="title" class="screen" aria-label="タイトル"></section>
<section id="result" class="screen" aria-label="結果" hidden></section>
<section id="dex" class="screen" aria-label="演出図鑑" hidden></section>
<section id="pauseScr" class="screen" aria-label="一時停止" hidden></section>
<div id="err" role="alert" hidden></div>
<script>
/* ======================= 共通エンジン ======================= */
'use strict';
/* =================================================================
 *  ARCADE CORE v1.0 — ミニゲーム共通エンジン
 *  -----------------------------------------------------------------
 *  このコードは各ゲームのHTMLに「そのまま埋め込まれて」います。
 *  外部ライブラリ・外部通信は一切ありません。
 *  （「Xにポスト」ボタンを押した時だけ、ユーザー操作で投稿画面を開きます）
 *
 *  主な部品:
 *    U        … 小物ユーティリティ
 *    Store    … 端末内保存（localStorage／使えない時はメモリ保存）
 *    Sound    … WebAudioで効果音をその場で合成（音源ファイル不要＝著作権フリー）
 *    Haptic   … 対応端末で軽い振動
 *    FX / PR  … パーティクル・画面揺れ・フラッシュ・演出の部品
 *    Banner / Toast … 大見出しと小さな通知
 *    BG / DECO … 章ごとに変わる背景（ストーリー演出）
 *    Specials … 特殊演出の登録・判定・図鑑（発見状況を端末に保存）
 *    Core     … 画面遷移・スコア・章・結果・Xシェア・エラー処理
 * ================================================================= */

/* ---------- U: ユーティリティ ---------- */
const U = {
  rand(a = 1, b) { return b === undefined ? Math.random() * a : a + Math.random() * (b - a); },
  randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },

/* ---------- Specials: 特殊演出の登録・判定・図鑑 ---------- */
/*  1件の特殊演出の書式:
 *  { id:'一意なID', ev:'発火イベント名', cat:'図鑑の分類', name:'名前', desc:'発見後の説明', hint:'未発見時のヒント',
 *    lv:1〜4（大きいほど派手）, rep:true（1プレイ中に何度でも発火）, test:(ctx)=>bool,
 *    fx:{ c:'パレット名', p:['部品名',...], snd:'メロディ名', n:基準音, b:'見出し', s:'小見出し',
 *         sh:揺れ, fl:フラッシュ, css:'fx-…', slow:スロー秒, hs:ヒットストップ秒, emoji:'🐈', ch:'文字' },
 *    run:(x,y,ctx)=>{} 追加の独自処理 }                                                        */
const Specials = {
  list: [], map: {}, dex: {}, run: new Set(), runList: [], runNew: new Set(),
  load() { this.dex = Store.get('dex', {}) || {}; },
  define(arr) { for (const s of arr) { if (!s || this.map[s.id]) { if (s) console.warn('duplicate special', s.id); continue; } s.lv = s.lv || 1; this.list.push(s); this.map[s.id] = s; } },
  total() { return this.list.length; },
  foundCount() { let n = 0; for (const s of this.list) if (this.dex[s.id]) n++; return n; },
  reset() { this.run = new Set(); this.runList = []; this.runNew = new Set(); },
  /** イベント発生時に呼ぶ。条件に合う演出を格の高い順に max 件まで再生 */
  check(ev, ctx = {}, x, y, max = 2) {
    const hits = [];
    for (const s of this.list) {
      if (s.ev !== ev) continue;
      if (!s.rep && this.run.has(s.id)) continue;
      let ok = false; try { ok = !!s.test(ctx); } catch (e) { ok = false; }
      if (ok) hits.push(s);
    }
    if (!hits.length) return hits;
    hits.sort((a, b) => b.lv - a.lv);
    const play = hits.slice(0, max);
    play.forEach((s, i) => { const go = () => this.fire(s, x, y, ctx); i === 0 ? go() : setTimeout(go, i * 480); });
    return play;
  },
  fire(s, x, y, ctx) {
    this.run.add(s.id); if (!this.runList.includes(s.id)) this.runList.push(s.id);
    const isNew = !this.dex[s.id];
    if (isNew) { this.dex[s.id] = Date.now(); Store.set('dex', this.dex); this.runNew.add(s.id); }
    try { playSpecial(s, x, y, ctx); } catch (e) { console.error(e); }
    if (isNew) Toast.show(`<b>NEW!</b>演出発見『${U.esc(s.name)}』<span>${this.foundCount()}/${this.total()}</span>`);
  }
};
/** 特殊演出の再生（fx の指定を部品の組み合わせに変換） */
function playSpecial(s, x, y, ctx) {
  const f = s.fx || {}, lv = s.lv, pal = PAL[f.c] || PAL.gold;
  if (x == null) { x = FX.w / 2; y = FX.h * 0.42; }
  const parts = f.p || (lv >= 3 ? ['burst', 'ring', 'confetti'] : lv === 2 ? ['burst', 'ring'] : ['burst']);
  parts.forEach(n => { const fn = PR[n]; if (fn) fn(x, y, pal, lv, f); });
  if (f.emoji) PR.walker(x, y, pal, lv, f);
  if (f.sh || lv >= 3) FX.shake(f.sh || lv * 2.5, 0.25 + lv * 0.08);
  if (f.fl) FX.flash(f.flc || pal[0], f.fl);
  if (f.css) FX.css(f.css);
  if (f.slow) Core.slow(f.slow);
  if (f.hs) Core.hitStop(f.hs);
  Sound.motif(f.snd || (lv >= 3 ? 'fanfare' : lv === 2 ? 'up' : 'chime'), f.n || 72);
  const title = typeof f.b === 'function' ? f.b(ctx) : (f.b || s.name);
  const sub = typeof f.s === 'function' ? f.s(ctx) : (f.s != null ? f.s : (s.desc || ''));
  const col = f.col || pal[0];
  const shown = lv >= 2 && Banner.show(title, sub, col, lv);
  if (!shown) FX.text(x, y - 46, title, col, lv >= 2 ? 30 : 24);
  Haptic.vib(lv >= 3 ? [30, 40, 60] : 10 + lv * 8);
  if (s.run) try { s.run(x, y, ctx); } catch (e) { }
}

/* ---------- 全ゲーム共通の特殊演出（スコア・時刻・日付・プレイ回数・レア・記録・物語） ---------- */
function commonSpecials(cfg) {
  const S = [];
  const sc = (id, name, desc, hint, test, lv, fx, rep) => S.push({ id: 'c_' + id, ev: 'score', cat: 'スコアの数字', name, desc, hint, test, lv, fx, rep });
  const live = c => !c.silent && c.score > 0;
  sc('end0', 'キリ番', 'スコアの一の位が0になった', '一の位に注目', c => live(c) && c.score % 10 === 0, 1, { c: 'mint', p: ['ring'], snd: 'chime', n: 84 }, true);
  sc('end00', 'ダブルキリ番', '下2桁が00になった', '一の位と十の位が…', c => live(c) && c.score % 100 === 0, 2, { c: 'ice', p: ['ring', 'burst', 'sparkle'], snd: 'sparkle', b: 'ダブルキリ番！', s: c => `${U.fmt(c.score)}点ピッタリ` }, true);
  sc('end000', 'トリプルキリ番', '下3桁が000になった', '0が3つ並ぶと…', c => live(c) && c.score % 1000 === 0, 3, { c: 'gold', p: ['shock', 'fireworks', 'confetti'], snd: 'fanfare', fl: 0.3, b: 'トリプルキリ番!!', s: c => `${U.fmt(c.score)}点ピッタリ` }, true);
  sc('end0000', 'キリ番の極み', '下4桁が0000になった', '0が4つ…？', c => live(c) && c.score % 10000 === 0, 4, { c: 'royal', p: ['implode', 'fireworks', 'confetti', 'wave'], snd: 'royal', fl: 0.4, hs: 0.15, css: 'fx-bright' }, true);
  const rep = [
    null,
    ['イチの行列', 'stars', 'gold', 'star'], ['ニャンニャン行進', 'hearts', 'candy', 'meow', '🐈'], ['サンサン太陽', 'beam', 'sunset', 'chord'],
    ['四つ葉の奇跡', 'glyphs', 'forest', 'sparkle', null, '♣'], ['ゴーゴーゴー', 'comet', 'fire', 'power'], ['六花の雪', 'snow', 'ice', 'bell'],
    ['ラッキーセブン行進', 'wave', 'rainbow', 'jingle'], ['パチパチ拍手', 'glyphs', 'gold', 'drum', null, '👏'], ['キュウキョクの9', 'spiral', 'galaxy', 'magic'],
  ];
  for (let d = 1; d <= 9; d++) {
    const [nm, part, pal, snd, emoji, ch] = rep[d];
    sc('rep' + d, `ゾロ目「${d}」${nm}`, `スコアが${d}${d}${d}…とゾロ目になった`, `${d}が並ぶスコア`, c => live(c) && U.isRep(c.score) && U.str(c.score)[0] === String(d), 3, { c: pal, p: [part, 'ring'], snd, emoji, ch, b: c => `ゾロ目 ${c.score}`, s: nm }, true);

  // 物語：章の到達（第2章以降）とエンディング

/* ---------- Core: ゲーム全体の進行 ---------- */
const Core = {
  cfg: null, state: 'boot', score: 0, best: 0, plays: 0, chapter: 0, paused: false,
  timeScale: 1, slowT: 0, hitT: 0, errCount: 0, lastErrAt: 0, settings: null, _last: 0, last: null, dexFrom: 'title', resultAt: 0, storyTm: 0,

  /** 各ゲームから呼ぶ初期化 */
  init(cfg) {
    this.cfg = cfg;
    Store.setNs('arcade:' + cfg.id);
    const rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.settings = Object.assign({ sound: true, reduce: rm, vib: true }, Store.get('settings', {}));
    this.applySettings();
    document.documentElement.style.setProperty('--acc', cfg.color || '#ffd54a');
    FX.init(); BG.init(); Banner.el = U.$('#banner');
    Specials.load(); Specials.define(cfg.specials || []); Specials.define(commonSpecials(cfg));
    this.best = Store.get('best', 0); this.plays = Store.get('plays', 0);
    this.buildUI();
    BG.set(cfg.chapters[0].theme, true);
    const unlock = () => Sound.init();
    addEventListener('pointerdown', unlock, { capture: true, passive: true });
    addEventListener('keydown', unlock, { capture: true });
    addEventListener('keydown', e => this.onKey(e));
    addEventListener('resize', () => { FX.resize(); BG.resize(); cfg.onResize && cfg.onResize(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); });
    if (cfg.setup) cfg.setup();
    this.showTitle();
    this._last = U.now(); requestAnimationFrame(t => this.frame(t));
  },

  frame(t) {
    let dt = (t - this._last) / 1000; this._last = t; if (!(dt > 0)) dt = 0; dt = Math.min(dt, 0.05);
    try {
      if (this.slowT > 0) { this.slowT -= dt; if (this.slowT <= 0) this.timeScale = 1; }
      const gdt = dt * this.timeScale;
      BG.draw(dt);
      if (this.state === 'play' && !this.paused) { if (this.hitT > 0) { this.hitT -= dt; this.cfg.draw && this.cfg.draw(); } else this.cfg.update && this.cfg.update(gdt, dt); }
      else if (this.cfg.idle) this.cfg.idle(dt);
      FX.update(this.state === 'play' ? gdt : dt); FX.draw();
    } catch (e) { this.handleError(e); }
    requestAnimationFrame(tt => this.frame(tt));
  },

  /* ---- 画面UIの組み立て ---- */

    </div>`;
    U.$('#dex').innerHTML = `<div class="card dex">

    const on = (id, fn) => U.$('#' + id).addEventListener('click', ev => { Sound.init(); fn(ev); });
    on('btnStart', () => this.start());
    on('btnDex', () => this.openDex('title'));
    on('btnDex2', () => { if (this.guard()) this.openDex('result'); });

    on('btnResume', () => this.resume());

    on('btnPause', () => this.pause());
    on('btnMute', () => this.toggle('sound'));
    U.$('#btnShare').addEventListener('click', ev => { if (!this.guard()) { ev.preventDefault(); return; } Sound.motif('chime', 84); });
    // HUDのボタンを押した時にゲーム側へタップが伝わらないように
    U.$('#hud').addEventListener('pointerdown', ev => ev.stopPropagation());
    this.refreshToggles();
  },
  /** 結果画面直後の誤タップ防止 */
  guard() { return U.now() - this.resultAt > 550; },
  showScreen(id) {
    ['title', 'result', 'dex', 'pauseScr'].forEach(s => U.$('#' + s).hidden = s !== id);
    document.body.classList.toggle('scr', !!id);
    const focus = { title: '#btnStart', result: '#btnRetry', dex: '#btnDexBack', pauseScr: '#btnResume' }[id];
    if (focus) setTimeout(() => { const b = U.$(focus); b && b.focus({ preventScroll: true }); }, 60);
  },
  showTitle() {
    this.state = 'title'; U.$('#hud').hidden = true; this.combo(0); this.story(null);
    U.$('#tBest').textContent = U.fmt(this.best);
    U.$('#tDex').textContent = `${Specials.foundCount()} / ${Specials.total()}`;
    BG.set(this.cfg.chapters[0].theme); BG.flow = 0;
    this.cfg.onTitle && this.cfg.onTitle();

  },
  openDex(from) {
    this.dexFrom = from; const found = Specials.foundCount(), total = Specials.total();
    U.$('#dCount').textContent = `${found} / ${total}`;
    U.$('#dBar').style.width = (found / total * 100).toFixed(1) + '%';
    const cats = {}; Specials.list.forEach(s => { (cats[s.cat || 'その他'] = cats[s.cat || 'その他'] || []).push(s); });

<script>

  onTitle() { S.st = 'idle'; if (board) { setLabel(''); dots.innerHTML = ''; info.textContent = ''; board.classList.add('locked'); } },
  onQuit() { S.st = 'idle'; },
  onPause() { if (S.st === 'show' || S.st === 'input') { S._resume = true; } },
  onResume() { if (S._resume) { S._resume = false; playback(600); } },
  onKey(e) {
    if (e.repeat) return; const k = e.key.toLowerCase();
    if (/^[1-9]$/.test(k)) { e.preventDefault(); press(+k - 1); return; }
    const cols = S.n === 4 ? 2 : 3;
    KEYROWS.forEach((row, r) => { const c = row.indexOf(k); if (c >= 0 && c < cols) { const idx = r * cols + c; if (idx < S.n) { e.preventDefault(); press(idx); } } });
  },
  update,
  shareText: r => `【メモリー・フラッシュ】${U.fmt(r.score)}点！\nLv.${r.level} 到達／PERFECT ${r.perfects}回\n称号「${r.rank.t}」(${r.rank.g})\n${Core.dexLine()}`,
});
/* テスト用の自動演奏（コンソールから window.__auto() を呼ぶと正解を1つ押す） */
window.__auto = () => { if (S.st !== 'input') return; const want = S.seq[S.spec.reverse ? S.seq.length - 1 - S.pos : S.pos]; press(Math.random() < 0.96 ? want : (want + 1) % S.n); };
})();

</script>
</body>
