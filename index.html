<style>
  :root{--bg:#07060f;--card:#14112a;--line:#2a2550;--txt:#fff;--sub:#b9b4d8}
  *{box-sizing:border-box;margin:0}
  body{background:radial-gradient(900px 500px at 50% -10%,#3a2a8a55,transparent 70%),var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;min-height:100vh;
    padding:calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
  header{max-width:880px;margin:0 auto 26px;text-align:center}
  h1{font-size:clamp(26px,6.5vw,40px);word-break:keep-all;font-weight:900;text-shadow:0 0 24px #b388ff}
  header p{margin-top:10px;color:var(--sub);font-size:15px;line-height:1.7}
  .grid{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;
    transition:transform .15s,border-color .15s,box-shadow .15s}
  a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 45%,transparent);outline:none}
  a.card:active{transform:scale(.98)}
  .card img{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;background:#000}
  .meta{padding:14px 16px 16px;display:flex;align-items:center;gap:12px}
  .meta div{flex:1;min-width:0}
  .meta b{display:block;font-size:20px;font-weight:900;color:var(--c)}
  .meta span{display:block;margin-top:4px;font-size:14px;color:var(--sub);line-height:1.5}
  .meta .play{flex:none;margin:0;font-weight:900;font-size:15px;background:var(--c);color:#111;padding:9px 16px;border-radius:999px}
  footer{max-width:880px;margin:30px auto 0;text-align:center;color:var(--sub);font-size:13px;line-height:1.8}
</style>
</head>
<body>
<header>
  <h1>ブラウザで遊べる<wbr>ミニゲーム集</h1>
  <p>無料・インストール不要。タップするだけですぐ始まります。<br>どのゲームにも、100種類以上の隠し演出が眠っています。</p>
</header>
<main class="grid">
  <a class="card" style="--c:#ffd54a" href="0%E7%A7%92%E3%82%BF%E3%83%83%E3%83%97.html">
    <img src="og_react.png" alt="0秒タップのプレイ画面" loading="lazy">
    <div class="meta"><div><b>0秒タップ</b><span>光った瞬間にタップ。0.2秒を切ればPERFECT。</span></div><span class="play">遊ぶ ▶</span></div>
  </a>
  <a class="card" style="--c:#3dfcff" href="%E3%82%AE%E3%83%AA%E3%82%AE%E3%83%AA%E5%9B%9E%E9%81%BF.html">
    <img src="og_dodge.png" alt="ギリギリ回避のプレイ画面" loading="lazy">
    <div class="meta"><div><b>ギリギリ回避</b><span>ぶつかる寸前でよけるほど高得点。</span></div><span class="play">遊ぶ ▶</span></div>
  </a>
  <a class="card" style="--c:#b388ff" href="%E3%81%B2%E3%81%8B%E3%82%8A%E3%81%AE%E8%A8%98%E6%86%B6.html">
    <img src="og_memory.png" alt="ひかりの記憶のプレイ画面" loading="lazy">
    <div class="meta"><div><b>ひかりの記憶</b><span>光った順番を覚えてタップ。どんどん長くなる。</span></div><span class="play">遊ぶ ▶</span></div>
  </a>
  <a class="card" style="--c:#ff9f43" href="%E7%81%AF%E7%AF%AD%E3%82%B9%E3%83%8A%E3%82%A4%E3%83%97.html">
    <img src="og_flick.png" alt="灯篭スナイプのプレイ画面" loading="lazy">
    <div class="meta"><div><b>灯篭スナイプ</b><span>引いて放って、灯篭を一投でまとめて灯せ。</span></div><span class="play">遊ぶ ▶</span></div>
  </a>
</main>
<footer>記録はあなたの端末の中にだけ保存され、外部には送信されません。</footer>
</body>
</html>
