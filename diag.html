<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音のテスト</title>
<style>
  body{margin:0;padding:20px 16px 40px;background:#0b0a18;color:#fff;font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif}
  h1{font-size:22px;margin:0 0 6px}
  p{color:#c9c6e6;font-size:14px;line-height:1.6;margin:0 0 14px}
  button{display:block;width:100%;margin:12px 0 4px;padding:16px;font-size:17px;font-weight:800;border:0;border-radius:14px;background:#ffd54a;color:#111}
  button.b2{background:#3dfcff}button.b3{background:#b388ff}button.b4{background:#ff9f43}
  .r{font-size:13px;color:#9ef0c8;min-height:1.4em;white-space:pre-wrap;word-break:break-all}
  pre{background:#16142c;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#ddd}
</style>
</head>
<body>
<h1>🔊 音のテスト</h1>
<p>上から順にボタンを押して、<b>音が鳴ったかどうか</b>を教えてください。最後に、いちばん下の灰色の欄をスクリーンショットで送ってください。</p>

<button id="t1">① ゲームと同じ方式で鳴らす</button><div class="r" id="r1"></div>
<button id="t2" class="b2">② マナーモードでも鳴る設定で鳴らす</button><div class="r" id="r2"></div>
<button id="t3" class="b3">③ 音声ファイル方式で鳴らす</button><div class="r" id="r3"></div>
<button id="t4" class="b4">④ ①をもう一度（2回目）</button><div class="r" id="r4"></div>

<pre id="info"></pre>
<script>
const log = [];
const info = () => { document.getElementById('info').textContent = [
  'UA: ' + navigator.userAgent,
  'audioSession: ' + (navigator.audioSession ? navigator.audioSession.type : 'なし'),
  'AudioContext: ' + (!!(window.AudioContext || window.webkitAudioContext)),
  ...log].join('\n'); };
info();
const AC = window.AudioContext || window.webkitAudioContext;
let ctx1 = null;
function beep(c, freq) {
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + 0.05;
  o.type = 'square'; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.55);
}
async function webaudio(id, opt) {
  const r = document.getElementById(id);
  try {
    if (opt.session && navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (e) { log.push(id + ' session err: ' + e.message); } }
    const c = opt.reuse && ctx1 ? ctx1 : new AC();
    if (!ctx1) ctx1 = c;
    const before = c.state;
    try { await c.resume(); } catch (e) { log.push(id + ' resume err: ' + e.message); }
    beep(c, opt.freq);
    setTimeout(() => { r.textContent = `状態: ${before} → ${c.state}　サンプルレート: ${c.sampleRate}`; log.push(`${id}: ${before} → ${c.state} / session=${navigator.audioSession ? navigator.audioSession.type : '-'}`); info(); }, 300);
  } catch (e) { r.textContent = 'エラー: ' + e.message; log.push(id + ' err: ' + e.message); info(); }
}
function wav() {
  const sr = 22050, n = Math.floor(sr * 0.5), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(i / sr * 2 * Math.PI * 660) * 9000 * Math.min(1, (n - i) / 2000), true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
document.getElementById('t1').onclick = () => webaudio('r1', { freq: 523 });
document.getElementById('t2').onclick = () => webaudio('r2', { freq: 659, session: true });
document.getElementById('t3').onclick = () => {
  const a = new Audio(wav()); a.play().then(() => { document.getElementById('r3').textContent = '再生できました'; log.push('r3: ok'); info(); })
    .catch(e => { document.getElementById('r3').textContent = 'エラー: ' + e.message; log.push('r3 err: ' + e.message); info(); });
};
document.getElementById('t4').onclick = () => webaudio('r4', { freq: 784, reuse: true });
</script>
</body>
</html>
